<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>NPCTE ERP</title>
<meta name="description" content="NPCTE College ERP - The New Progressive College of Teachers' Education, Mehsana">
<meta name="theme-color" content="#14284b">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NPCTE">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body>
<style>
/* Layout: login split screen; app = left rail + top bar + one working canvas (side drawers for detail). Two themes: light and dark. */
:root{
  --bg:#f5f6f9; --surface:#ffffff; --sunk:#eef0f4; --line:#e2e5ea;
  --fg:#14213d; --muted:#5b6472;
  --accent:#14284b; --accent-soft:#e8edf7; --accent-fg:#ffffff;
  --marigold:#b8862b; --marigold-soft:#fbf3e2;
  --good:#15803d; --good-soft:#dcfce7; --warn:#b45309; --warn-soft:#fef3c7; --bad:#b91c1c; --bad-soft:#fee2e2;
  --rail:#14284b; --rail-fg:#c3cde2; --rail-hover:#1d3561; --rail-active:#25427a; --rail-active-fg:#f3d9a4; --rail-line:#24406f; --rail-strong:#ffffff;
  --art:#14284b; --art-fg:#c3cde2; --art-strong:#ffffff;
  --badge-bg:#b91c1c; --badge-fg:#ffffff; --field-line:#7f8a9d;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.08);
  --display:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0f1c; --surface:#111a2d; --sunk:#17223a; --line:#24314d; --fg:#e6eaf2; --muted:#94a0b4;
  --accent:#e0b25a; --accent-soft:#3a2d12; --accent-fg:#1a1405; --marigold:#e0b25a; --marigold-soft:#3a2d12;
  --good:#4ade80; --good-soft:#12301f; --warn:#fbbf24; --warn-soft:#3a2c0c; --bad:#f87171; --bad-soft:#3b1717;
  --rail:#0c1630; --rail-fg:#9aa6ba; --rail-hover:#14244a; --rail-active:#1d3561; --rail-active-fg:#f3d9a4; --rail-line:#1d2c4f; --rail-strong:#e6eaf2;
  --art:#0a1020; --art-fg:#9aa6ba; --art-strong:#e6eaf2;
  --badge-bg:#d32020; --badge-fg:#ffffff; --field-line:#66748f;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0f1c; --surface:#111a2d; --sunk:#17223a; --line:#24314d; --fg:#e6eaf2; --muted:#94a0b4;
  --accent:#e0b25a; --accent-soft:#3a2d12; --accent-fg:#1a1405; --marigold:#e0b25a; --marigold-soft:#3a2d12;
  --good:#4ade80; --good-soft:#12301f; --warn:#fbbf24; --warn-soft:#3a2c0c; --bad:#f87171; --bad-soft:#3b1717;
  --rail:#0c1630; --rail-fg:#9aa6ba; --rail-hover:#14244a; --rail-active:#1d3561; --rail-active-fg:#f3d9a4; --rail-line:#1d2c4f; --rail-strong:#e6eaf2;
  --art:#0a1020; --art-fg:#9aa6ba; --art-strong:#e6eaf2;
  --badge-bg:#d32020; --badge-fg:#ffffff; --field-line:#66748f;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
a{color:var(--accent)}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}
.right{text-align:right}
.hide{display:none!important}

/* ---------- login ---------- */
.login{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.login-art{background:var(--art);color:var(--art-fg);padding:48px max(32px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.login-art h1{font-size:32px;line-height:1.15;letter-spacing:-.02em;font-weight:700;color:var(--art-strong);margin:18px 0 12px}
.login-art p{max-width:42ch;margin:0}
.seal{width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.login-art .points{display:grid;gap:10px;font-size:13px}
.login-art .points span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--art-strong);opacity:.7;margin-right:10px;vertical-align:2px}
.login-form{padding:48px max(32px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;justify-content:center;gap:22px;max-width:560px;width:100%;margin:0 auto}
.login-form h2{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0}
.demo-accts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.acct{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.acct:hover{border-color:var(--accent)}
.acct:focus-visible{outline:2px solid var(--accent)}
.acct b{font-size:13px}
.acct small{color:var(--muted)}
.err{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:8px 12px;font-weight:600}

/* ---------- shell ---------- */
main{min-width:0;padding-block:0 56px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}

/* ---------- common ---------- */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.2}
.top p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.pill{height:fit-content;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.gold{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 10px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.panel h2{font-size:15px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.panel h3{font-size:14px;margin:16px 0 6px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.grid{display:grid;gap:16px}
.two{grid-template-columns:1.5fr 1fr}.even{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:repeat(3,1fr)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.kpi .v{font-size:24px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.tablewrap{overflow-x:auto;background:linear-gradient(90deg,var(--surface) 30%,transparent) 0 0/36px 100% no-repeat local,linear-gradient(270deg,var(--surface) 30%,transparent) 100% 0/36px 100% no-repeat local,radial-gradient(farthest-side at 0 50%,rgba(15,23,42,.2),transparent) 0 0/9px 100% no-repeat scroll,radial-gradient(farthest-side at 100% 50%,rgba(15,23,42,.2),transparent) 100% 0/9px 100% no-repeat scroll}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--sunk)}
td.num,th.num{text-align:right}
.who{display:flex;gap:10px;align-items:center}
.av{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.warn i{background:var(--warn)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
input,select,textarea{background:var(--surface);border:1px solid var(--field-line);border-radius:8px;padding:8px 10px;min-width:0}
::placeholder{color:var(--muted);opacity:1}
textarea{width:100%;resize:vertical}
.filters input[type=search]{flex:1;min-width:180px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field input,.field select,.field textarea{width:100%}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.form .span{grid-column:1/-1}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li small{color:var(--muted);display:block}
.amt{font-weight:700;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.empty{text-align:center;color:var(--muted);padding:28px}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px;margin-bottom:16px;overflow-x:auto}
.tabs button{flex:none;border:0;background:transparent;padding:8px 14px;border-radius:7px;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.steps{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.steps em{color:var(--muted);font-style:normal}
.steps .pill.cur{background:var(--accent);color:var(--accent-fg)}
.rline{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.rline.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:700}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--sunk)}
.stack i{display:block;height:100%}
.crow{display:grid;grid-template-columns:70px 1fr 56px;gap:10px;align-items:center}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 0}
.facts b{display:block;font-weight:600;overflow-wrap:anywhere}
.matrix td,.matrix th{text-align:center}.matrix td:first-child,.matrix th:first-child{text-align:left}
.matrix input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.hl{background:var(--marigold-soft);border:1px solid var(--marigold);border-radius:10px;padding:12px 14px}
.flow{display:flex;gap:16px;flex-wrap:wrap;align-items:center;border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--bg)}
.qr{width:132px;height:132px;border-radius:8px;overflow:hidden;flex:none;border:1px solid var(--line)}
.receipt{border:1.5px dashed var(--line);border-radius:10px;padding:16px;background:var(--bg)}
.receipt .hd{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:10px}
.receipt .hd b{font-size:15px}
.cancelled{text-decoration:line-through;color:var(--muted)}
.bubble{background:var(--good-soft);border-radius:12px 12px 12px 2px;padding:10px 12px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:520px}
.sheet{width:100%;max-width:340px;margin:0 auto;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:18px;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.csvbox{font-family:var(--mono);font-size:12px;min-height:220px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}

/* drawer + dialogs */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.5);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:41;overflow-y:auto;
  padding-top:max(22px,env(safe-area-inset-top,0px));padding-bottom:max(22px,env(safe-area-inset-bottom,0px));
  padding-left:22px;padding-right:max(22px,env(safe-area-inset-right,0px));box-shadow:-10px 0 40px rgba(0,0,0,.25)}
.drawer.wide{width:min(760px,100%)}
.drawer h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
.x{float:right}
.dialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;z-index:55;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dialog h3{margin:0 0 6px;font-size:17px;font-weight:700}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:600;z-index:70;max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}

@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:1fr}}
@media (max-width:1180px){.two{grid-template-columns:1fr}}
.two.onecol{grid-template-columns:1fr}
@media (max-width:820px){
  .login{grid-template-columns:1fr}
  .login-art{padding-block:28px}.login-art h1{font-size:28px}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .form,.even,.demo-accts{grid-template-columns:1fr}
  .facts{grid-template-columns:1fr 1fr}
}
@media (max-width:520px){.kpis{grid-template-columns:1fr}.top h1{font-size:24px}}
/* phones: top bar buttons become icons so the name always fits */

/* =====================================================================
   Motion layer. Everything below is switched off for people who ask their
   device for reduced motion.
   ===================================================================== */
:root{--ease:cubic-bezier(.22,1,.36,1);--ease-soft:cubic-bezier(.4,0,.2,1)}
.kpi,.acct{position:relative;overflow:hidden}
.kpi::after,.acct::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%)}
.kpi:hover::after,.acct:hover::after{opacity:1}
.seal{box-shadow:0 0 0 0 transparent}
.receipt .tick{display:flex;align-items:center;gap:10px;margin:0 0 10px;color:var(--good);font-weight:700}
.receipt .tick svg{width:30px;height:30px;flex:none}
.receipt .tick circle{fill:var(--good-soft);stroke:var(--good);stroke-width:2}
.receipt .tick path{fill:none;stroke:var(--good);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.login-art{position:relative;overflow:hidden;isolation:isolate}
.login-art>*{position:relative;z-index:1}
.login-art::before,.login-art::after{content:"";position:absolute;z-index:0;border-radius:50%;filter:blur(60px);opacity:.55;pointer-events:none}
.login-art::before{width:380px;height:380px;background:#3b82f6;top:-120px;right:-120px}
.login-art::after{width:320px;height:320px;background:#6366f1;bottom:-120px;left:-80px}

@media (prefers-reduced-motion:no-preference){
  .btn,.iconbtn,.tabs button,.nav button,.acct,.pill,input,select,textarea{transition:background-color .2s var(--ease-soft),color .2s var(--ease-soft),border-color .2s var(--ease-soft),box-shadow .2s var(--ease-soft),transform .18s var(--ease)}
  .btn:hover,.iconbtn:hover{transform:translateY(-1px);box-shadow:0 4px 12px color-mix(in srgb,var(--fg) 10%,transparent)}
  .btn:active,.iconbtn:active,.acct:active,.nav button:active{transform:scale(.97);box-shadow:none}
  .btn.primary:hover{box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent);outline:none}
  .kpi,.panel{transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s var(--ease-soft)}
  .kpi:hover{transform:translateY(-3px);box-shadow:0 10px 28px color-mix(in srgb,var(--fg) 10%,transparent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
  .nav button:hover{transform:translateX(2px)}
  tbody tr{transition:background-color .15s var(--ease-soft)}
  tbody tr:hover td{background:color-mix(in srgb,var(--accent) 6%,transparent)}
  tr.click:hover td{background:color-mix(in srgb,var(--accent) 8%,transparent)}
  .tabs button[aria-selected="true"]{animation:pop .28s var(--ease)}
  .theme-anim,.theme-anim *{transition:background-color .35s var(--ease-soft),color .35s var(--ease-soft),border-color .35s var(--ease-soft),fill .35s,stroke .35s!important}

  /* page entrance: parts of the page rise in one after another */
  #page.enter>*{animation:rise .55s var(--ease) both}
  #page.enter>*:nth-child(2){animation-delay:.05s}#page.enter>*:nth-child(3){animation-delay:.1s}#page.enter>*:nth-child(4){animation-delay:.15s}#page.enter>*:nth-child(n+5){animation-delay:.2s}
  #page.enter .kpis>*,#page.enter .grid>*{animation:rise .6s var(--ease) both}
  #page.enter .kpis>*:nth-child(1),#page.enter .grid>*:nth-child(1){animation-delay:.08s}#page.enter .kpis>*:nth-child(2),#page.enter .grid>*:nth-child(2){animation-delay:.14s}
  #page.enter .kpis>*:nth-child(3),#page.enter .grid>*:nth-child(3){animation-delay:.2s}#page.enter .kpis>*:nth-child(4),#page.enter .grid>*:nth-child(4){animation-delay:.26s}
  #page.enter tbody tr{animation:fadeRow .45s var(--ease) both}
  #page.enter tbody tr:nth-child(1){animation-delay:.12s}#page.enter tbody tr:nth-child(2){animation-delay:.16s}#page.enter tbody tr:nth-child(3){animation-delay:.2s}#page.enter tbody tr:nth-child(4){animation-delay:.24s}#page.enter tbody tr:nth-child(5){animation-delay:.28s}#page.enter tbody tr:nth-child(6){animation-delay:.32s}#page.enter tbody tr:nth-child(n+7){animation-delay:.36s}
  #page.enter .bar i,#page.enter .stack i{transform-origin:left;animation:grow .9s var(--ease) .25s both}
  #page.swap>*:not(.top):not(.tabs){animation:fade .3s var(--ease) both}
  .li{transition:background-color .15s}
  .list .li:hover{background:color-mix(in srgb,var(--accent) 4%,transparent)}

  /* layers */
  .scrim{animation:fade .2s var(--ease-soft) both;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
  .drawer{animation:slideIn .38s var(--ease) both}
  .dialog{animation:dialogIn .3s var(--ease) both}
  .toast{animation:toastIn .4s var(--ease) both}
  .leaving.scrim{animation:fadeOut .16s var(--ease-soft) both}
  .leaving.drawer{animation:slideOut .2s var(--ease-soft) both}
  .leaving.dialog{animation:dialogOut .15s var(--ease-soft) both}
  .admstep:not(.hide){animation:stepIn .35s var(--ease) both}
  .receipt{animation:rise .5s var(--ease) both}
  .receipt .tick circle{stroke-dasharray:90;stroke-dashoffset:90;animation:draw .6s var(--ease) .1s forwards}
  .receipt .tick path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .4s var(--ease) .5s forwards}
  .qr{animation:pop .5s var(--ease) both}
  .badge{animation:pulse 2.4s ease-in-out infinite}
  .err{animation:shake .35s var(--ease)}

  /* login */
  .login-art::before{animation:float1 14s ease-in-out infinite alternate}
  .login-art::after{animation:float2 17s ease-in-out infinite alternate}
  .login-art h1,.login-art p,.login-art .seal,.login-art .points span{animation:rise .8s var(--ease) both}
  .login-art .seal{animation-delay:.05s}.login-art h1{animation-delay:.12s}.login-art p{animation-delay:.2s}
  .login-art .points span:nth-child(1){animation-delay:.3s}.login-art .points span:nth-child(2){animation-delay:.38s}.login-art .points span:nth-child(3){animation-delay:.46s}
  .login-form>*{animation:rise .7s var(--ease) both}.login-form>*:nth-child(2){animation-delay:.08s}.login-form>*:nth-child(3){animation-delay:.16s}.login-form>*:nth-child(4){animation-delay:.24s}
  .acct{animation:rise .6s var(--ease) both}.acct:nth-child(1){animation-delay:.25s}.acct:nth-child(2){animation-delay:.3s}.acct:nth-child(3){animation-delay:.35s}.acct:nth-child(4){animation-delay:.4s}.acct:nth-child(5){animation-delay:.45s}.acct:nth-child(6){animation-delay:.5s}
  .acct:hover{transform:translateY(-2px)}
  .app{animation:fade .5s var(--ease-soft) both}

  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes fadeOut{to{opacity:0}}
  @keyframes fadeRow{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes pop{from{opacity:.4;transform:scale(.92)}to{opacity:1;transform:none}}
  @keyframes slideIn{from{transform:translateX(48px);opacity:0}to{transform:none;opacity:1}}
  @keyframes slideOut{to{transform:translateX(48px);opacity:0}}
  @keyframes dialogIn{from{opacity:0;transform:translate(-50%,-46%) scale(.95)}to{opacity:1;transform:translate(-50%,-50%)}}
  @keyframes dialogOut{to{opacity:0;transform:translate(-50%,-48%) scale(.97)}}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,16px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}
  @keyframes stepIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}50%{box-shadow:0 0 0 6px transparent}}
  @keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
  @keyframes float1{to{transform:translate(-60px,70px) scale(1.15)}}
  @keyframes float2{to{transform:translate(80px,-50px) scale(1.2)}}
}
@media (prefers-reduced-motion:reduce){

}

/* ---- Laptop polish: slim scrollbars everywhere, rail fits short screens ---- */
html,body{margin:0}

*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--muted) 45%,transparent) transparent}

/* =====================================================================
   App shell. Grouped sidebar that collapses to an icon rail, a drawer on
   phones, Profile and Sign out at the bottom of the sidebar, and a slim
   top bar that only carries notifications and the theme switch.
   ===================================================================== */
:root{--r:12px;--r-sm:8px;--shadow-md:0 4px 14px rgba(15,23,42,.08);--topbar-h:56px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.app{--rail-w:256px;display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);min-height:100vh;transition:grid-template-columns .22s var(--ease)}
.app>*{min-width:0}
.rail{position:sticky;top:0;height:100vh;height:100dvh;min-height:0;display:flex;flex-direction:column;background:var(--rail);color:var(--rail-fg);border-right:1px solid var(--rail-line);z-index:30}
.rail-head{display:flex;align-items:center;gap:8px;padding:14px 12px 10px 16px;min-height:62px}
.brand{display:flex;gap:10px;align-items:center;min-width:0;flex:1}
.brand .seal{width:34px;height:34px;font-size:16px;flex:none}
.brand .bt{min-width:0}
.brand b{color:var(--rail-strong);font-weight:700;font-size:13.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.brand small{display:block;font-size:11px;color:var(--muted)}
.rail-toggle,.rail-close{all:unset;box-sizing:border-box;cursor:pointer;width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--rail-fg);flex:none}
.rail-toggle:hover,.rail-close:hover{background:var(--rail-hover);color:var(--rail-strong)}
.rail-toggle:focus-visible,.rail-close:focus-visible,.menu-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.rail-close{display:none}
.nav{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;display:flex;flex-direction:column;gap:12px;padding:4px 10px 10px}
.ng{display:flex;flex-direction:column;gap:2px}
.gl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 10px 4px}
.nav button{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;align-items:center;gap:11px;width:100%;min-width:0;padding:7px 10px;border-radius:var(--r-sm);font-weight:500;line-height:1.25;color:var(--rail-fg)}
.nav button:hover{background:var(--rail-hover);color:var(--rail-strong);transform:none}
.nav button[aria-current="page"]{background:var(--rail-active);color:var(--rail-active-fg);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .nl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .badge{margin-left:auto;background:var(--accent);color:var(--accent-fg);border-radius:99px;font-size:11px;font-weight:700;padding:0 7px;line-height:18px}
.rail-acct{border-top:1px solid var(--rail-line);padding:10px 10px 12px;display:flex;flex-direction:column;gap:4px}
.acct-row{display:flex;align-items:center;gap:4px}
.me,.out{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;align-items:center;border-radius:var(--r-sm);color:var(--rail-fg)}
.me{flex:1;min-width:0;gap:10px;padding:6px 8px}
.me .av{width:34px;height:34px}
.me .mt{min-width:0;display:block}
.me b{display:block;color:var(--rail-strong);font-size:13px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me small{display:block;color:var(--muted);font-size:11.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.out{flex:none;width:38px;height:38px;justify-content:center}
.out svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.me:hover,.out:hover{background:var(--rail-hover)}
.me:hover b{color:var(--accent)}
.out:hover{background:var(--bad-soft);color:var(--bad)}
.me[aria-current="page"]{background:var(--rail-active)}
.me:focus-visible,.out:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* instant hover labels (mouse and keyboard focus) */
.me[data-tip]::after,.out[data-tip]::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translate(-50%,4px);padding:4px 9px;border-radius:6px;background:var(--fg);color:var(--bg);font-size:12px;font-weight:500;line-height:1.3;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s,transform .12s;z-index:40}
.me[data-tip]::after{left:44px;transform:translate(0,4px)}
@media (hover:hover){.me:hover::after,.out:hover::after{opacity:1}.me:hover::after{transform:translate(0,0)}.out:hover::after{transform:translate(-50%,0)}}
.me:focus-visible::after,.out:focus-visible::after{opacity:1}
/* collapsed rail: the same instant label on every menu icon (position is set from script, fixed so the scrolling menu cannot clip it) */
.nav button[data-tip]::after{display:none}
@media (min-width:821px){
  .app[data-rail=mini] .nav button[data-tip]::after{display:block;content:attr(data-tip);position:fixed;left:var(--tipx,84px);top:var(--tipy,0);transform:translate(-4px,-50%);padding:4px 9px;border-radius:6px;background:var(--fg);color:var(--bg);font-size:12px;font-weight:500;line-height:1.3;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s,transform .12s;z-index:60}
  .app[data-rail=mini] .nav button[data-tip]:active{transform:none}
}
@media (min-width:821px) and (hover:hover){.app[data-rail=mini] .nav button[data-tip]:hover::after{opacity:1;transform:translate(0,-50%)}}
.app[data-rail=mini] .nav button[data-tip]:focus-visible::after{opacity:1;transform:translate(0,-50%)}
.rail-foot{font-size:11px;line-height:1.35;color:var(--muted);padding:6px 10px 0}

/* collapsed icon rail (desktop and tablet) */
@media (min-width:821px){
  .app[data-rail=mini]{--rail-w:72px}
  .app[data-rail=mini] :is(.bt,.nl,.gl,.me .mt,.rail-foot){display:none}
  .app[data-rail=mini] .rail-head{flex-direction:column;justify-content:center;padding:10px 0 4px;gap:4px;min-height:0}
  .app[data-rail=mini] .brand{flex:none}
  .app[data-rail=mini] .nav{gap:4px;padding:4px 12px 8px}
  .app[data-rail=mini] .ng+.ng{border-top:1px solid var(--rail-line);padding-top:4px}
  .app[data-rail=mini] .nav button{justify-content:center;padding:8px 0}
  .app[data-rail=mini] .rail-acct{padding:8px 12px 10px}
  .app[data-rail=mini] .acct-row{flex-direction:column;gap:4px}
  .app[data-rail=mini] .me{flex:none;justify-content:center;padding:4px;width:100%}
  .app[data-rail=mini] .out{width:100%}
  .app[data-rail=mini] :is(.me,.out)[data-tip]::after{bottom:auto;top:50%;left:calc(100% + 10px);transform:translate(-4px,-50%)}
  .app[data-rail=mini] :is(.me,.out):hover::after{transform:translate(0,-50%)}
  .app[data-rail=mini] .nav .badge{position:absolute;top:4px;right:8px;margin:0;width:9px;height:9px;min-width:0;padding:0;font-size:0;line-height:0}
}

/* top bar */
.topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:10px;min-height:var(--topbar-h);padding-block:8px;margin-inline:calc(-1*max(28px,env(safe-area-inset-left,0px)));padding-inline:max(28px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px)}

<script>
'use strict';
/* =====================================================================
   NPCTE College ERP - Phase 1 demo (browser only, data in localStorage).
   Spec: docs/NPCTE-ERP-Phase1-Spec.md. Money is stored as integer paise.
   Dates are kept as ISO yyyy-mm-dd (Asia/Kolkata) and shown as DD-MM-YYYY.
   ===================================================================== */
const LS_KEY='npcte_erp_v1', SES_KEY='npcte_erp_session_v1', THEME_KEY='npcte_erp_theme', DB_VER=1;
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* inr takes PAISE */
const inr=p=>{const n=Math.round(p||0)/100;return (n<0?'-':'')+'₹'+Math.abs(n).toLocaleString('en-IN',{maximumFractionDigits:2})};
const toPaise=v=>{const n=Number(String(v??'').replace(/[₹,\s]/g,''));if(!isFinite(n))return NaN;return Math.round(n*100)};
const pad=(n,l=2)=>String(n).padStart(l,'0');
const TZ='Asia/Kolkata';
/* calendar date in India for a timestamp */
const istDate=ts=>{const p=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(ts));const g=t=>p.find(x=>x.type===t).value;return`${g('year')}-${g('month')}-${g('day')}`};
const istTime=ts=>new Date(ts).toLocaleTimeString('en-IN',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:true});
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>istDate(Date.now());
const parseD=iso=>{const [y,m,d]=String(iso).slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(iso,n)=>{const d=parseD(iso);d.setDate(d.getDate()+n);return isoOf(d)};
const diffDays=(a,b)=>Math.round((parseD(a)-parseD(b))/864e5);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtD=iso=>{if(!iso)return '—';const [y,m,d]=String(iso).slice(0,10).split('-');return`${d}-${m}-${y}`};
const fmtT=ts=>ts?fmtD(istDate(ts))+', '+istTime(ts):'—';
const validIso=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||'')&&isoOf(parseD(v))===v;
const uid=p=>p+Math.random().toString(36).slice(2,9);
const sum=(a,f=x=>x)=>a.reduce((s,x)=>s+(f(x)||0),0);
const initials=n=>String(n).replace(/^(Dr\.|Prof\.|Shri|Smt\.)\s+/,'').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
let _seed=11;const rnd=()=>{_seed=(_seed*16807)%2147483647;return _seed/2147483647};

/* ---------- storage ---------- */
const memStore={};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return memStore[k]??null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){memStore[k]=v;return false}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(e){delete memStore[k]}};
/* the signed-in user lives in sessionStorage, so two tabs can hold two logins (for example Clerk + Student) and watch live updates */
const sesGet=()=>{try{return sessionStorage.getItem(SES_KEY)}catch(e){return memStore[SES_KEY]??null}};
const sesSet=v=>{try{sessionStorage.setItem(SES_KEY,v)}catch(e){memStore[SES_KEY]=v}};
const sesDel=()=>{try{sessionStorage.removeItem(SES_KEY)}catch(e){delete memStore[SES_KEY]}};
let db=null;
const SAVE_FAIL_MSG='Could not save: changes will be lost on reload';
let saveBad=false,saveTick=false;
function saveBanner(on){
  if(typeof document==='undefined'||!document.body)return;
  let b=document.getElementById('savebar');
  if(!on){if(b)b.remove();document.body.classList.remove('save-bad');return}
  if(!b){b=document.createElement('div');b.id='savebar';b.setAttribute('role','alert');b.textContent=SAVE_FAIL_MSG+'. Browser storage is full or blocked.';document.body.insertBefore(b,document.body.firstChild)}
  document.body.classList.add('save-bad');
}
function save(){const ok=lsSet(LS_KEY,JSON.stringify(db));saveBad=!ok;if(!ok){saveTick=true;Promise.resolve().then(()=>{saveTick=false})}saveBanner(!ok);return ok}
function load(){const raw=lsGet(LS_KEY);if(raw){try{db=JSON.parse(raw);if(db&&db.ver===DB_VER){migrate();return}}catch(e){}}seed();save()}
function migrate(){
  const s=db.settings;s.flags=Object.assign({expenseReducesDue:false,fundingAllCategories:false,lateFee:false},s.flags||{});
  if(!db.outbox)db.outbox=[];if(!db.notifs)db.notifs=[];if(!db.deposits)db.deposits=[];if(!db.upiOrders)db.upiOrders=[];if(!db.expenses)db.expenses=[];
  if(!db.enquiries)db.enquiries=[];
}
const NAME_MAX=80;
const capText=(v,label,max=NAME_MAX)=>{v=String(v??'').trim();if(v.length>max)throw new Error(`${label} is too long (${v.length} characters; the limit is ${max}).`);return v};

/* ---------- roles and permissions (checked in every handler; the real server must check the same) ---------- */
const PERMS=[
 ['dashboard.view','See the dashboard'],
 ['students.view','View students'],['students.edit','Add and edit students, resend logins'],
 ['fees.view','Open Fee Collection'],['fees.collect','Collect payments (Cash, Cheque, UPI)'],['fees.cancel','Cancel a receipt (with reason)'],
 ['fees.editdate','Edit invoice date of Cash / Cheque / Expense'],['expenses.manage','Add expenses'],['fees.setup','Fee setup (default fees, receipt prefix, UPI)'],
 ['audit.view','Transactions audit and exports'],['audit.deposit','Mark cash / cheque as deposited'],['activity.view','Activity log (every action)'],
 ['notices.post','Post notices and fee reminders'],['enquiries.view','Admission enquiries'],
 ['settings.manage','College settings'],['roles.manage','Roles and permissions']];
const ROLE_NAMES=['Super Admin','Principal','Clerk','Student'];
const STAFF_ROLES=['Principal','Clerk'];
const ALL_STAFF_PERMS=PERMS.map(p=>p[0]);
const DEFAULT_ROLES=()=>({
 'Principal':ALL_STAFF_PERMS.slice(),
 'Clerk':['dashboard.view','students.view','students.edit','fees.view','fees.collect','fees.cancel','fees.editdate','expenses.manage','audit.view','audit.deposit','notices.post','enquiries.view']});
const cur=()=>db&&db.users.find(u=>u.id===sesGet()&&u.active);
const can=p=>{const u=cur();if(!u)return false;if(u.role==='Super Admin')return true;if(u.role==='Student')return false;return (db.roles[u.role]||[]).includes(p)};
const canAny=(...p)=>p.some(can);
const need=(p,what)=>{if(!can(p))throw new Error('You do not have access'+(what?' to '+what:''))};
const isStudentUser=u=>!!u&&u.role==='Student';
/* a student login may open only its own record (spec §14: another student's id -> 403) */
const mayStudent=id=>{const u=cur();if(!u)return false;if(u.role==='Student')return !!id&&u.studentId===id;return can('students.view')};
function guardStudent(id){if(!mayStudent(id))throw new Error('403 · You can only open your own record')}

/* ---------- lookups ---------- */
const stu=id=>db.students.find(s=>s.id===id);
const course=id=>db.courses.find(c=>c.id===id);
const CATS=['General','OBC','SC','ST','EWS'];
const fundingApplies=cat=>db.settings.flags.fundingAllCategories||cat==='SC'||cat==='ST';
const classLabel=s=>`${course(s.course).name} · Sem ${s.sem}`;

/* ---------- audit log: every action with before / after ---------- */
const device=()=>{const ua=navigator.userAgent;const t=/Mobi|Android|iPhone/i.test(ua)?'Phone':'Desktop';const b=/Edg\//.test(ua)?'Edge':/Chrome\//.test(ua)?'Chrome':/Firefox\//.test(ua)?'Firefox':/Safari\//.test(ua)?'Safari':'Browser';return t+' · '+b};
function log(action,entity,entityId,before,after,detail){
  const u=cur();
  db.audit.unshift({id:uid('a'),at:Date.now(),actorId:u?u.id:'',actor:u?u.name:'System',role:u?u.role:'System',action,entity:entity||'',entityId:entityId||'',before:before??null,after:after??null,detail:detail||'',ip:'127.0.0.1 (demo)',device:device()});
  if(db.audit.length>1500)db.audit.length=1500;
}
/* kept for the shared UI plumbing: page views and clicks are not stored in this build */
const humanize=n=>String(n||'').replace(/([a-z0-9])([A-Z])/g,'$1 $2').replace(/[_-]+/g,' ').replace(/^./,c=>c.toUpperCase());
function ev(){}
function evFlush(){}
const EV_KEY='npcte_events_unused';let evBuf=[];

/* ---------- fees: per semester ---------- */
const semFee=(s,n)=>s.fees.find(f=>f.sem===n);
const okPays=s=>db.payments.filter(p=>p.studentId===s.id&&p.status==='SUCCESS');
function semSummary(s,n){
  const f=semFee(s,n);const amount=f?f.amount:0;
  const paid=sum(okPays(s).filter(p=>p.sem===n),p=>p.amount);
  const adj=db.settings.flags.expenseReducesDue?sum(db.expenses.filter(x=>x.studentId===s.id&&x.sem===n),x=>x.amount):0;
  const due=Math.max(0,amount-paid-adj);const dueDate=f&&f.due||'';
  const started=n<=s.sem;
  const T=today();const overdue=started&&due>0&&dueDate&&dueDate<T;
  const status=amount===0?'No fee':due===0?'Paid':paid+adj>0?'Partial':started?'Not paid':'Upcoming';
  return{sem:n,amount,paid,adj,due,dueDate,started,overdue,status};
}
function feeSum(s){
  const sems=[1,2,3,4].map(n=>semSummary(s,n));
  const cur_=sems.filter(x=>x.started);
  return{sems,total:sum(sems,x=>x.amount),paid:sum(sems,x=>x.paid),payable:s.status==='ACTIVE'?sum(cur_,x=>x.due):0,upcoming:sum(sems.filter(x=>!x.started),x=>x.due),overdue:cur_.some(x=>x.overdue)};
}
/* invoice date rules (spec §5.2)
   CASH / CHEQUE / EXPENSE -> the date the user enters (default today, editable later)
   UPI -> payment date in India + 1 day, never editable */
const upiInvoiceDate=paidAt=>addDays(istDate(paidAt),1);
function nextReceiptNo(){const c=db.college;const n=c.nextReceipt++;return`${c.receiptPrefix}${pad(n,4)}`}
function recordPayment(s,o){
  /* o: {sem, mode, amount(paise), invoiceDate?, chequeNo?, bank?, chequeDate?, upiRef?, providerTxnId?, note?, paidAt?} */
  const sm=semSummary(s,o.sem);
  if(!(o.amount>0))throw new Error('Enter an amount greater than zero');
  if(o.amount>sm.due)throw new Error(`Amount is more than the semester ${o.sem} due (${inr(sm.due)})`);
  const entryAt=Date.now();
  const invoiceDate=o.mode==='UPI'?upiInvoiceDate(o.paidAt||entryAt):o.invoiceDate;
  if(!validIso(invoiceDate))throw new Error('Choose a valid invoice date');
  const u=cur();
  const p={id:uid('p'),studentId:s.id,sem:o.sem,mode:o.mode,amount:o.amount,invoiceDate,entryAt,paidAt:o.paidAt||entryAt,
    chequeNo:o.chequeNo||'',bank:o.bank||'',chequeDate:o.chequeDate||'',upiRef:o.upiRef||'',providerTxnId:o.providerTxnId||'',note:o.note||'',
    status:'SUCCESS',cancelReason:'',rc:nextReceiptNo(),depositId:'',by:u?u.name:'Payment gateway',byId:u?u.id:'',dateEdits:[]};
  db.payments.push(p);
  log('Payment recorded','Payment',p.rc,null,{student:s.enrol,sem:p.sem,mode:p.mode,amount:inr(p.amount),invoiceDate:fmtD(p.invoiceDate)});
  return p;
}
function cancelPayment(p,reason){
  need('fees.cancel','cancel receipts');
  reason=capText(reason,'Reason',200);if(reason.length<4)throw new Error('Write the reason for cancelling (at least 4 characters)');
  if(p.status!=='SUCCESS')throw new Error('Only a successful receipt can be cancelled');
  if(p.depositId)throw new Error('This money is already marked as deposited. Undo the deposit first.');
  p.status='CANCELLED';p.cancelReason=reason;p.cancelledAt=Date.now();p.cancelledBy=cur().name;
  log('Receipt cancelled','Payment',p.rc,{status:'SUCCESS'},{status:'CANCELLED',reason});
}
function editInvoiceDate(kind,rec,iso){
  need('fees.editdate','change invoice dates');
  if(!validIso(iso))throw new Error('Choose a valid date');
  if(kind==='p'&&rec.mode==='UPI')throw new Error('UPI invoice date is fixed (payment date + 1 day)');
  if(kind==='p'&&rec.status!=='SUCCESS')throw new Error('A cancelled receipt cannot be changed');
  const field=kind==='p'?'invoiceDate':'date';const old=rec[field];if(old===iso)return false;
  rec[field]=iso;(rec.dateEdits=rec.dateEdits||[]).push({at:Date.now(),from:old,to:iso,by:cur().name});
  log('Invoice date changed',kind==='p'?'Payment':'Expense',kind==='p'?rec.rc:rec.ref,{date:fmtD(old)},{date:fmtD(iso)},'Receipt regenerated');
  return true;
}

/* ---------- enrolment numbers BED25-001 ---------- */
function nextEnrol(courseId,year){const k=courseId+String(year).slice(2);const n=(db.counters.enrol[k]||0)+1;db.counters.enrol[k]=n;return`${k}-${pad(n,3)}`}
function tempPassword(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ',a='abcdefghjkmnpqrstuvwxyz',d='23456789',sy='@#$%&*!';const pick=s=>s[Math.floor(Math.random()*s.length)];
  let p=[pick(A),pick(a),pick(d),pick(sy)];const all=A+a+d+sy;while(p.length<10)p.push(pick(all));return p.sort(()=>Math.random()-.5).join('')}
/* due date of semester n: odd semesters fall in the admission's academic year (Jul-Dec), even ones in Jan-Jun of the next calendar year */
function defaultDue(courseId,year,n){const d=db.settings.dueDates[courseId]||[];const md=d[n-1]||'';if(!/^\d{2}-\d{2}$/.test(md))return'';const [m,dd]=md.split('-').map(Number);const y=+year+Math.floor((n-1)/2)+(m<7?1:0);return`${y}-${pad(m)}-${pad(dd)}`}
function makeStudent(d){
  const s={id:uid('s'),enrol:d.enrol||nextEnrol(d.course,d.admissionYear),name:d.name,gender:d.gender||'',dob:d.dob||'',phone:d.phone||'',email:d.email||'',address:d.address||'',photo:d.photo||'',
    course:d.course,admissionYear:+d.admissionYear,sem:+d.sem||1,category:d.category||'General',funding:d.funding||'CASH',scholarshipNote:d.scholarshipNote||'',status:d.status||'ACTIVE',
    createdBy:d.createdBy||'System',createdAt:d.createdAt||Date.now(),
    fees:[1,2,3,4].map(n=>({sem:n,amount:d.fees?d.fees[n-1]:db.settings.feeDefault[d.course][n-1],due:d.dues?d.dues[n-1]:defaultDue(d.course,d.admissionYear,n)}))};
  if(!fundingApplies(s.category))s.funding='CASH';
  return s;
}
function createStudentLogin(s,pw,must){
  const u={id:uid('u'),role:'Student',name:s.name,username:s.enrol.toLowerCase(),email:s.email,phone:s.phone,password:pw,mustChange:must,active:true,studentId:s.id,lastLoginAt:0};
  db.users.push(u);s.userId=u.id;return u;
}

/* ---------- sample data (spec §12: 1 Super Admin, 1 Principal, 1 Clerk, ~20 students, all 4 modes, a few notices) ---------- */
function seed(){
  _seed=11;const T=today();const Y=+T.slice(0,4);const yNow=+T.slice(5,7)>=7?Y:Y-1;
  db={ver:DB_VER,
    college:{name:"The New Progressive College of Teachers' Education",short:'NPCTE',trust:'Karve Trust',address:"'PRASAD' Building, Karve Campus, Mahesana 384001",phone:'02762 220395',email:'npcte@yahoo.co.in',website:'https://npcte.org',receiptPrefix:'NPCTE/'+String(yNow).slice(2)+'-',nextReceipt:1,year:`${yNow}-${String(yNow+1).slice(2)}`},

    users:[
      {id:'u_admin',role:'Super Admin',name:'Virat Sathavara',username:'admin',email:'admin@npcte.org',phone:'',password:'admin123',mustChange:false,active:true,lastLoginAt:0},
      {id:'u_prin',role:'Principal',name:'Principal, NPCTE',username:'principal',email:'principal@npcte.org',phone:'',password:'principal123',mustChange:false,active:true,lastLoginAt:0},
      {id:'u_clerk',role:'Clerk',name:'Accounts Clerk',username:'clerk',email:'accounts@npcte.org',phone:'',password:'clerk123',mustChange:false,active:true,lastLoginAt:0}],
    students:[],payments:[],expenses:[],deposits:[],notices:[],notifs:[],audit:[],outbox:[],upiOrders:[],enquiries:[],
    counters:{enrol:{},exp:1}};

/* Submit-once guard for everything that moves money or cannot be undone. The first submit disables the buttons and any repeat (double-click, Enter held down, a click during the closing animation) is ignored until the action has finished. If the action is refused the buttons come back so the person can fix the form. The server must still enforce this itself (an Active-receipt check in cancelPayment, a "waiting" check on requests). */
const ONCE_FORMS=new Set(['collect','cancelReceipt','addStudent','expense','deposit','notice','sendRemind','restore','upiPay']);

function lockOnce(root,on){
  const bs=root.matches&&root.matches('button')?[root]:$$('button:not([type=button])',root);
  bs.forEach(b=>{if(on){b.disabled=true;b.setAttribute('aria-busy','true')}else{b.disabled=false;b.removeAttribute('aria-busy')}});
  if(on)root.dataset.busy='1';else delete root.dataset.busy;
}
function onceRun(root,fn){
  if(root.dataset.busy==='1')return false;
  const ae=document.activeElement;lockOnce(root,true);let ok=false;
  try{ok=fn()}finally{
    if(!ok){lockOnce(root,false);if(ae&&ae.isConnected&&document.activeElement!==ae)softFocus(ae)}
    else setTimeout(()=>{if(root.isConnected&&!root.closest('.leaving'))lockOnce(root,false)},700);
  }
  return ok;
}

/* ---------- tables become cards on phones: label every cell with its column name ---------- */
function labelTables(root=document){
  $$('table',root).forEach(t=>{
    const heads=$$('thead th',t).map(h=>h.textContent.trim());
    $$('tbody tr:not([data-l])',t).forEach(tr=>{
      tr.dataset.l='1';const tds=[...tr.children].filter(c=>c.tagName==='TD'||c.tagName==='TH');let col=0;
      tds.forEach(td=>{
        const span=td.colSpan||1;
        td.dataset.label=span>1?'':(heads[col]||'');col+=span;
        const txt=td.textContent.trim();
        const hasUi=td.querySelector('input,select,textarea,button,svg,img,.bar,.stack');
        if(!txt&&!hasUi)td.dataset.empty='1';
        else if(!txt&&td.querySelector('input[type=checkbox]')&&!td.querySelector('button'))td.dataset.check='1';
        else if(!td.dataset.label&&td.querySelector('button')&&span===1&&!td.querySelector('input,select'))td.dataset.actions='1';
      });
      if(tds.length>=5)tr.dataset.many='1';
      const prim=tr.querySelector('.who')?.closest('td')||tds.find(td=>!td.dataset.check&&!td.dataset.empty&&!td.dataset.actions&&td.dataset.label!==undefined);
      if(prim&&tds.length>1)prim.dataset.primary='1';
    });
  });
}

const MAIL_OK=/^[^\s@,;<>"]+@[^\s@,;<>"]+\.[^\s@,;<>"]{2,}$/;
function readStudentForm(f,d,old){
  const name=capText(d.name,'Name');if(name.length<2)throw new Error('Enter the student\'s full name');
  const phone=String(d.phone||'').replace(/\D/g,'');if(!/^[6-9]\d{9}$/.test(phone))throw new Error('Enter a 10-digit mobile number');
  const email=String(d.email||'').trim().toLowerCase();if(!MAIL_OK.test(email))throw new Error('Enter a valid email (login details are sent there)');
  if(db.students.some(s=>s!==old&&s.email.toLowerCase()===email))throw new Error('Another student already uses this email');
  if(!db.courses.some(c=>c.id===d.course))throw new Error('Choose B.Ed or M.Ed');

  if(!CATS.includes(d.category))throw new Error('Choose a category');
  const fundOn=fundingApplies(d.category);if(fundOn&&!['CASH','SCHOLARSHIP'].includes(d.funding))throw new Error('Choose the funding type: By Cash or By Scholarship');
  if(d.dob&&!validIso(d.dob))throw new Error('Check the date of birth');
  const fees=SEMS.map(n=>{const a=toPaise(d['fee'+n]);if(!(a>=0)||a>100000000)throw new Error(`Semester ${n} fee must be a number between 0 and 10,00,000`);const due=d['due'+n]||'';if(due&&!validIso(due))throw new Error(`Check the semester ${n} due date`);return{sem:n,amount:a,due}});

}

/* ---------- CSV import (spec §15.6: a template for students only) ---------- */
const IMPORT_COLS=['name','gender','dob','phone','email','address','course','admissionYear','sem','category','funding','fee1','fee2','fee3','fee4'];
ACT.importStudents=()=>{need('students.edit');drawer(`<button class="btn x" data-act="close">Close</button><h2>Import students from CSV</h2>

  <div class="actions" style="margin:10px 0"><button class="btn" data-act="importTpl">Download template</button><label class="btn"><input type="file" accept=".csv,text/csv" class="sr" data-change="importFile"> Choose CSV file</label></div>
  <div id="importOut"></div>`,true)};
ACT.importTpl=()=>download('npcte-student-import-template.csv','﻿'+csvOf(IMPORT_COLS,[['Riya Patel','F','2003-04-15','9876543210','riya.patel@example.com','Mahesana','BED',today().slice(0,4),'1','SC','SCHOLARSHIP','30000','30000','30000','30000']]),'text/csv;charset=utf-8');
function parseCsv(t){const rows=[];let r=[],v='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'&&t[i+1]==='"'){v+='"';i++}else if(c==='"')q=false;else v+=c}else if(c==='"')q=true;else if(c===','){r.push(v);v=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(v);rows.push(r);r=[];v=''}else v+=c}if(v||r.length){r.push(v);rows.push(r)}return rows.filter(x=>x.some(y=>y.trim()))}
CHG.importFile=el=>{const file=el.files&&el.files[0];if(!file)return;file.text().then(t=>{
  const rows=parseCsv(t.replace(/^﻿/,''));const hd=rows.shift().map(h=>h.trim());const miss=['name','phone','email','course','admissionYear','category'].filter(c=>!hd.includes(c));
  if(miss.length){$('#importOut').innerHTML=`<div class="err">Missing columns: ${E(miss.join(', '))}</div>`;return}
  const ok=[],bad=[];rows.forEach((r,i)=>{const d={};hd.forEach((h,j)=>d[h]=(r[j]||'').trim());d.course=(d.course||'').toUpperCase();d.funding=(d.funding||'CASH').toUpperCase();d.sem=d.sem||1;
    SEMS.forEach(n=>{d['fee'+n]=d['fee'+n]||String(db.settings.feeDefault[d.course]?db.settings.feeDefault[d.course][n-1]/100:'');d['due'+n]=''});
    try{ui.photo='';const v=readStudentForm(null,d,null);if(ok.some(x=>x.email===v.email))throw new Error('Email repeated in the file');ok.push(v)}catch(e){bad.push(`Row ${i+2}: ${e.message}`)}});
  ui.importRows=ok;$('#importOut').innerHTML=`<div class="panel" style="padding:12px"><p style="margin:0"><b>${ok.length}</b> ready to import${bad.length?`, <b class="t-bad">${bad.length}</b> with problems`:''}.</p>${bad.length?`<ul class="note">${bad.slice(0,20).map(b=>`<li>${E(b)}</li>`).join('')}</ul>`:''}
   ${ok.length?`<button class="btn primary" style="margin-top:10px" data-act="importGo">Import ${ok.length} students</button>`:''}</div>`}).catch(()=>toast('Could not read the file',true))};

const MODES=[['CASH','By Cash'],['CHEQUE','By Cheque'],['UPI','By UPI'],['EXPENSE','By Expense']];

const MODE_TONE={CASH:'m-cash',CHEQUE:'m-cheque',UPI:'m-upi',EXPENSE:'m-exp'};

function feeTabs(){const t=[['collect','Collect payment']];if(can('expenses.manage')||can('audit.view'))t.push(['expenses','Expenses']);t.push(['dues','Pending dues'],['receipts','Receipts']);if(can('fees.setup'))t.push(['setup','Fee setup']);return t}

/* ---------- 1. collect ---------- */
function feeCollect(){
  need('fees.view');const c=ui.col=ui.col||{q:'',sid:'',sem:0,mode:'CASH'};const s=c.sid&&stu(c.sid);
  const q=c.q.trim().toLowerCase();
  const hits=q?db.students.filter(x=>x.status==='ACTIVE'&&[x.name,x.enrol,x.phone].some(v=>String(v).toLowerCase().includes(q))).slice(0,8):[];
  let body='';
  if(!s)body=`<div class="panel"><h2>1 · Find the student</h2><input type="search" id="colQ" data-live="colQ" value="${E(c.q)}" placeholder="Type name, enrolment no. or mobile" aria-label="Find student" class="bigin" autocomplete="off">
    <div class="list" style="margin-top:8px">${hits.map(x=>{const sm=feeSum(x);return`<button class="li pick" data-act="colPick" data-id="${E(x.id)}"><div class="who">${avatar(x)}<div><b>${E(x.name)}</b><small>${E(x.enrol)} · ${E(classLabel(x))} · ${E(x.phone)}</small></div></div><span>${sm.payable?`<b class="amt">${inr(sm.payable)}</b> <small class="muted">due</small>`:pill('Paid up','good')}</span></button>`}).join('')||(q?'<p class="note">No active student matches. Check the spelling or enrolment no.</p>':'<p class="note">Start typing to search. Tip: you can also open a student from Students or Pending dues and press Collect.</p>')}</div></div>`;
  else{
    const sm=feeSum(s);const m=c.sem&&semSummary(s,c.sem);
    body=`<div class="panel"><div class="li" style="border:0;padding-top:0"><div class="who">${avatar(s)}<div><b>${E(s.name)}</b><small>${E(s.enrol)} · ${E(classLabel(s))} · ${E(s.category)} · ${E(fundLabel(s.funding))}</small></div></div><button class="btn sm" data-act="colReset">Change student</button></div>
     <h2 style="margin-top:6px">2 · Pick the semester</h2><div class="sempick" role="radiogroup" aria-label="Semester">${sm.sems.map(x=>`<button type="button" role="radio" aria-checked="${c.sem===x.sem}" class="sp ${x.due?'':'done'}" data-act="colSem" data-sem="${x.sem}" ${x.due?'':'disabled'}><b>Sem ${x.sem}</b><span>${x.due?inr(x.due)+' due':'Paid'}</span><small>${x.started?(x.overdue?'Overdue':x.dueDate?'Due '+fmtD(x.dueDate):''):'Upcoming'}</small></button>`).join('')}</div>
     ${m?`<h2 style="margin-top:16px">3 · Mode of payment</h2><div class="modes" role="radiogroup" aria-label="Mode">${MODES.map(([k,l])=>`<button type="button" role="radio" aria-checked="${c.mode===k}" class="md ${MODE_TONE[k]}" data-act="colMode" data-m="${k}"${k!=='EXPENSE'&&!can('fees.collect')||k==='EXPENSE'&&!can('expenses.manage')?' disabled':''}>${E(l)}</button>`).join('')}</div>
     <div style="margin-top:16px">${collectForm(s,m,c.mode)}</div>`:''}</div>`;
  }
  return`<div class="grid two-col">${body}<div class="panel"><h2>Today's collection</h2>${todayBox()}</div></div>`;
}
function todayBox(){const T=today();const ok=db.payments.filter(p=>p.status==='SUCCESS'&&p.invoiceDate===T);const ex=db.expenses.filter(x=>x.date===T);
  return`<div class="list">${['CASH','CHEQUE','UPI'].map(m=>`<div class="li"><span>${modePill(m)}</span><b class="amt">${inr(sum(ok.filter(p=>p.mode===m),p=>p.amount))}</b></div>`).join('')}<div class="li"><span>${modePill('EXPENSE')}</span><b class="amt">${inr(sum(ex,x=>x.amount))}</b></div></div>
  <h3>Latest receipts</h3><div class="list">${db.payments.filter(p=>p.status==='SUCCESS').sort((a,b)=>b.entryAt-a.entryAt).slice(0,6).map(p=>`<button class="li pick" data-act="viewReceipt" data-id="${E(p.id)}"><div><b>${E(stu(p.studentId).name)}</b><small>${E(p.rc)} · ${modeName(p.mode)} · invoice ${fmtD(p.invoiceDate)}</small></div><b class="amt">${inr(p.amount)}</b></button>`).join('')||'<p class="note">None yet.</p>'}</div>`}
function collectForm(s,m,mode){
  const T=today();const amt=F('amount','Amount (₹)',{val:m.due/100,req:true,attrs:`inputmode="decimal" max="${m.due/100}"`});
  if(mode==='CASH')return`<form data-form="collect" data-mode="CASH" class="form">${amt}${F('invoiceDate','Invoice date',{type:'date',val:T,req:true})}${F('note','Note (optional)',{span:1,attrs:'maxlength="120"'})}
   <p class="note span">Invoice date = the date you enter here (default today). The receipt uses this date. You can change it later in Receipts.</p><div class="actions span"><button class="btn primary big">Save cash payment · issue receipt</button></div></form>`;

/* ---------- UPI: PaymentProvider adapter (spec §5.4) ---------- */
/* The interface the server implements: createOrder, verifyWebhook, getStatus. Razorpay / Cashfree / PhonePe adapters and a Google Pay stub plug in here.
   In the demo the "gateway" is simulated in the browser and signs its webhook with a secret the UI code never uses to mark a payment. */
const PaymentProviders={
  Razorpay:{name:'Razorpay'},Cashfree:{name:'Cashfree'},PhonePe:{name:'PhonePe PG'},GooglePay:{name:'Google Pay (stub, off until approved)',stub:true}};
const GW_SECRET=uid('whsec_');
const sig=(s)=>{let h=2166136261;for(const ch of s+GW_SECRET){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)>>>0}return h.toString(16)};
const provider={
  createOrder(s,sem,amount,by){const o={id:'order_'+Math.random().toString(36).slice(2,12),studentId:s.id,sem,amount,status:'CREATED',createdAt:Date.now(),by,provider:db.settings.upi.provider,vpa:db.settings.upi.vpa};db.upiOrders.unshift(o);if(db.upiOrders.length>200)db.upiOrders.length=200;return o},
  verifyWebhook(evt){return !!evt&&evt.signature===sig(evt.orderId+'|'+evt.status+'|'+evt.amount+'|'+evt.paidAt)},
  getStatus(id){const o=db.upiOrders.find(x=>x.id===id);return o?o.status:'UNKNOWN'}};
/* server side: the only place a UPI payment becomes SUCCESS */
function handleUpiWebhook(evt){
  if(!provider.verifyWebhook(evt)){log('Webhook rejected','UPI order',evt&&evt.orderId,null,null,'Bad signature');throw new Error('Webhook signature did not verify. Payment NOT marked.')}
  const o=db.upiOrders.find(x=>x.id===evt.orderId);if(!o)throw new Error('Unknown order');if(o.status!=='CREATED')return null; /* webhooks may arrive twice: idempotent */
  if(evt.status==='captured'){const s=stu(o.studentId);const p=recordPayment(s,{sem:o.sem,mode:'UPI',amount:o.amount,paidAt:evt.paidAt,upiRef:evt.utr,providerTxnId:evt.txnId});p.by='UPI · '+o.provider;p.orderId=o.id;o.status='PAID';o.paymentId=p.id;afterPayment(p);return p}
  o.status='FAILED';o.failedAt=evt.paidAt;const s=stu(o.studentId);
  log('UPI payment failed','UPI order',o.id,null,{amount:inr(o.amount),student:s.enrol});
  notify('payfail','UPI payment failed',`${inr(o.amount)} for semester ${o.sem} did not go through. No money was taken.`,{students:[s.id],portal:'sfees',tone:'bad',self:true});
  notify('payfail',`UPI payment failed · ${s.name}`,`${inr(o.amount)} · semester ${o.sem}`,{roles:['Super Admin','Principal','Clerk'],staff:'fees',tab:'receipts',tone:'bad'});
  return null;
}
function upiDialog(o){
  const s=stu(o.studentId);const upi=`upi://pay?pa=${encodeURIComponent(o.vpa)}&pn=${encodeURIComponent(db.college.short)}&am=${(o.amount/100).toFixed(2)}&tn=${encodeURIComponent(s.enrol+' Sem '+o.sem)}&tr=${o.id}`;
  dialog(`<h3>Pay ${inr(o.amount)} with UPI</h3><p class="muted" style="margin:0 0 10px">${E(s.name)} · Semester ${o.sem} · order <span class="mono">${E(o.id)}</span></p>
   <div class="flow" style="margin-bottom:12px"><div class="qr">${qrSvg(upi)}</div><div><p style="margin:0">Scan with Google Pay, PhonePe, Paytm or any UPI app.</p><p class="note">UPI ID: <b class="mono">${E(o.vpa)}</b><br>Invoice date will be ${fmtD(upiInvoiceDate(Date.now()))} (payment date + 1 day).</p>
   ${isStudentUser(cur())?`<a class="btn primary" href="${E(upi)}" style="margin-top:6px;display:inline-block">Open UPI app</a>`:''}</div></div>
   <div class="panel sim"><b>Demo gateway (sandbox)</b><p class="note" style="margin:2px 0 8px">In the live system nothing on this screen marks the payment; the gateway calls our server. Use these to simulate the gateway webhook:</p>
   <div class="actions"><button class="btn" data-act="gwFail" data-id="${E(o.id)}">Webhook: payment failed</button><button class="btn primary" data-act="gwOk" data-id="${E(o.id)}">Webhook: payment captured</button></div></div>
   <div class="actions" style="justify-content:flex-end;margin-top:12px"><button class="btn" data-act="closeDialog">Close (keep waiting)</button></div>`,'UPI payment');
}
FORM.upiPay=(f,d)=>{

function gwEvent(id,status){const o=db.upiOrders.find(x=>x.id===id);if(!o)throw new Error('Order not found');const paidAt=Date.now();const evt={orderId:o.id,status,amount:o.amount,paidAt,utr:'UTR'+Math.floor(Math.random()*9e11+1e11),txnId:'pay_'+Math.random().toString(36).slice(2,14)};evt.signature=sig(evt.orderId+'|'+evt.status+'|'+evt.amount+'|'+evt.paidAt);return evt}

const HELV=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
function pdfSafe(t){
  return String(t??'').replace(/₹/g,'Rs. ').replace(/[–—]/g,'-').replace(/[·•]/g,'-').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/…/g,'...')
    .replace(/[^\x20-\x7e]/g,c=>{let n='';try{n=c.normalize('NFD').replace(/[̀-ͯ]/g,'')}catch(e){}return /^[\x20-\x7e]+$/.test(n)?n:'?'});
}
const pdfW=(t,size,bold)=>sum([...pdfSafe(t)],c=>HELV[c.charCodeAt(0)-32]||556)*size/1000*(bold?1.06:1);
const pdfEsc=t=>pdfSafe(t).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
function makePdf(draw,meta){
  const H=842,out=[];const col=h=>{const n=parseInt(h.slice(1),16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255].map(v=>v.toFixed(3)).join(' ')};
  const api={
    rect(x,y,w,h,fill){out.push(`${col(fill)} rg ${x} ${H-y-h} ${w} ${h} re f`)},
    line(x1,y1,x2,y2,stroke='#d7dce5',w=.8){out.push(`${col(stroke)} RG ${w} w ${x1} ${H-y1} m ${x2} ${H-y2} l S`)},
    text(x,y,t,o={}){const{size=10,bold=false,color='#1b2437',align='left'}=o;const w=pdfW(t,size,bold);const px=align==='right'?x-w:align==='center'?x-w/2:x;
      out.push(`BT /${bold?'F2':'F1'} ${size} Tf ${col(color)} rg ${px.toFixed(2)} ${(H-y).toFixed(2)} Td (${pdfEsc(t)}) Tj ET`)},
    stamp(t,o={}){const{size=70,color='#f3c4c4',x=300,y=470}=o;const w=pdfW(t,size,true);const c=Math.cos(Math.PI/4),s=Math.sin(Math.PI/4);
      out.push(`q ${c.toFixed(4)} ${s.toFixed(4)} ${(-s).toFixed(4)} ${c.toFixed(4)} ${x} ${H-y} cm BT /F2 ${size} Tf ${col(color)} rg ${(-w/2).toFixed(1)} 0 Td (${pdfEsc(t)}) Tj ET Q`)},
    wrap(x,y,t,width,o={}){const size=o.size||10,words=pdfSafe(t).split(/\s+/);let line='',yy=y;words.forEach(w=>{const tr=line?line+' '+w:w;if(pdfW(tr,size,o.bold)>width&&line){api.text(x,yy,line,o);yy+=size+4;line=w}else line=tr});if(line){api.text(x,yy,line,o);yy+=size+4}return yy}
  };
  draw(api);
  const content=out.join('\n');
  const objs=[
    '<< /Type /Catalog /Pages 2 0 R >>',
    '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> /Contents 4 0 R >>',
    `<< /Length ${content.length} >>\nstream\n${content}\nendstream`,
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>',
    `<< /Title (${pdfEsc(meta.title)}) /Author (${pdfEsc(meta.author)}) /Producer (NPCTE ERP) /CreationDate (D:${meta.date}) >>`
  ];
  let pdf='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';const offs=[];
  objs.forEach((o,i)=>{offs.push(pdf.length);pdf+=`${i+1} 0 obj\n${o}\nendobj\n`});
  const xref=pdf.length;
  pdf+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R /Info 7 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
  return pdf;
}
const rs=p=>'Rs. '+(Math.round(p||0)/100).toLocaleString('en-IN',{maximumFractionDigits:2});

const MAIL_DELAY=900;
function mailBody(rec){
  const s=stu(rec.studentId),c=db.college;
  if(rec.kind==='credentials')return{text:`Dear ${s.name},\n\nYour ${c.short} student portal is ready.\n\nPortal: ${location.origin}/\nLogin ID: ${s.enrol.toLowerCase()} (or ${s.email})\nTemporary password: ${rec.pw?'(sent in this email)':'—'}\n\nYou must choose your own password at the first sign-in.\n\nInstall as an app: open the portal in Chrome on Android and tap "Install app", or on iPhone open it in Safari, tap Share and then "Add to Home Screen".\n\n${c.name}\n${c.phone} · ${c.email}`};
  const p=db.payments.find(x=>x.id===rec.paymentId);
  return{text:`Dear ${s.name},\n\n${p.status==='CANCELLED'?'This receipt has been cancelled.':'We have received your fee payment.'}\nReceipt: ${p.rc}\nAmount: ${rs(p.amount)}\nSemester: ${p.sem}\nMode: ${modeName(p.mode)}\nInvoice date: ${fmtD(p.invoiceDate)}\n\nThe receipt PDF is attached.\n\n${c.name}\n${c.phone} · ${c.email}`,pdf:receiptPdf(p),filename:p.rc.replace(/[^\w-]+/g,'_')+'.pdf'};
}
function queueMail(o){
  const rec={id:uid('o'),ts:Date.now(),kind:o.kind,paymentId:o.paymentId||'',studentId:o.studentId,to:(o.to||[]).filter(e=>MAIL_OK.test(e||'')),subject:o.subject,status:'Queued',mode:db.settings.mail.mode,attempts:0,error:'',why:o.why||''};
  /* the temporary password lives only in the in-memory copy of the email, never in the outbox list that is saved */
  if(o.pw)Object.defineProperty(rec,'pw',{value:o.pw,enumerable:false});
  db.outbox.unshift(rec);if(db.outbox.length>300)db.outbox.length=300;
  if(!rec.to.length){rec.status='Skipped';rec.error='No valid email address on file';return rec}
  setTimeout(()=>deliver(rec.id,rec.pw),MAIL_DELAY);return rec;
}
async function deliver(id,pw){
  const rec=db.outbox.find(x=>x.id===id);if(!rec||/^Sent/.test(rec.status))return;const m=db.settings.mail;
  rec.status='Sending';rec.attempts++;
  try{
    if(m.mode==='live'&&rec.kind==='receipt'){
      const b=mailBody(rec);const r=await fetch('/api/send-receipt',{method:'POST',headers:{'content-type':'application/json','x-api-key':m.key||''},body:JSON.stringify({to:rec.to,subject:rec.subject,html:'<pre style="font:14px sans-serif;white-space:pre-wrap">'+E(b.text)+'</pre>',text:b.text,filename:b.filename,pdfBase64:btoa(b.pdf),fromName:m.fromName,replyTo:m.replyTo})});
      let j={};try{j=await r.json()}catch(e){}if(!r.ok||!j.ok)throw new Error(j.error||'Mail server answered '+r.status);rec.status='Sent';
    }else{await sleep(250);rec.status='Sent (demo)'}
    rec.sentAt=Date.now();rec.error='';
  }catch(e){rec.status='Failed';rec.error=e.message||'Could not send'}
  if(rec.kind==='credentials'){const s=stu(rec.studentId);if(s&&s.cred&&s.cred.mailId===rec.id){s.cred.status=rec.status;s.cred.at=rec.sentAt||Date.now()}}
  if(rec.status==='Failed')notify('mailfail',`Email failed · ${rec.subject}`,rec.error,{roles:['Super Admin','Principal','Clerk'],staff:'students',tone:'bad',self:true,key:'mf:'+rec.id});
  save();refreshMailUi();
}

function weekStart(iso){const d=parseD(iso);const k=(d.getDay()+6)%7;return addDays(iso,-k)}
function depPeriod(){const f=ui.f.dep=Object.assign({p:'week',from:'',to:''},ui.f.dep||{});const T=today();
  if(f.p==='week')return{from:weekStart(T),to:addDays(weekStart(T),6),f};if(f.p==='lastweek'){const w=addDays(weekStart(T),-7);return{from:w,to:addDays(w,6),f}}
  if(f.p==='month')return{from:T.slice(0,8)+'01',to:addDays(isoOf(new Date(+T.slice(0,4),+T.slice(5,7),1)),-1),f};
  if(f.p==='lastmonth'){const d=new Date(+T.slice(0,4),+T.slice(5,7)-2,1);return{from:isoOf(d),to:addDays(isoOf(new Date(d.getFullYear(),d.getMonth()+1,1)),-1),f}}
  return{from:f.from||addDays(T,-30),to:f.to||T,f}}
function auditDeposit(){
  const{from,to,f}=depPeriod();const inP=p=>p.invoiceDate>=from&&p.invoiceDate<=to&&p.status==='SUCCESS';
  const pays=db.payments.filter(inP);const und=pays.filter(p=>(p.mode==='CASH'||p.mode==='CHEQUE')&&!p.depositId);const ex=db.expenses.filter(x=>x.date>=from&&x.date<=to);
  const col=m=>{const l=m==='EXPENSE'?ex:pays.filter(p=>p.mode===m);return{t:sum(l,x=>x.amount),n:l.length,und:m==='CASH'||m==='CHEQUE'?sum(l.filter(p=>!p.depositId),p=>p.amount):null}};
  const sc=can('audit.deposit');
  return`<div class="panel"><h2>Cash & cheque deposit report</h2>
   <div class="filters"><div class="chips" role="group" aria-label="Period">${[['week','This week'],['lastweek','Last week'],['month','This month'],['lastmonth','Last month'],['custom','Custom']].map(([k,l])=>`<button type="button" class="chip" aria-pressed="${f.p===k}" data-act="depP" data-p="${k}">${l}</button>`).join('')}</div>
    ${f.p==='custom'?`<label class="dl">From <input type="date" value="${E(from)}" data-change="sf" data-scope="dep" data-k="from"></label><label class="dl">To <input type="date" value="${E(to)}" data-change="sf" data-scope="dep" data-k="to"></label>`:`<span class="muted">${fmtD(from)} to ${fmtD(to)}</span>`}</div>
   <div class="totals four">${['CASH','CHEQUE','UPI','EXPENSE'].map(m=>{const c=col(m);return`<div class="tt ${MODE_TONE[m]}"><span>${modeName(m)} · ${c.n}</span><b>${inr(c.t)}</b>${c.und!==null?`<small>${c.und?inr(c.und)+' not deposited':'all deposited'}</small>`:`<small>${m==='UPI'?'goes to bank by gateway':'paid out'}</small>`}</div>`}).join('')}</div>
   <h3>Not yet deposited · ${und.length} entries · ${inr(sum(und,p=>p.amount))}</h3>
   <div class="tablewrap"><table><thead><tr>${sc?`<th><input type="checkbox" aria-label="Select all" data-change="depAll" checked></th>`:''}<th>Invoice date</th><th>Receipt</th><th>Student</th><th>Mode</th><th>Cheque</th><th class="num">Amount</th></tr></thead><tbody>
   ${und.sort((a,b)=>a.invoiceDate<b.invoiceDate?-1:1).map(p=>`<tr>${sc?`<td><input type="checkbox" name="dep" value="${E(p.id)}" checked aria-label="Include ${E(p.rc)}" data-change="depCount"></td>`:''}<td>${fmtD(p.invoiceDate)}</td><td class="mono">${E(p.rc)}</td><td>${E(stu(p.studentId).name)}</td><td>${modePill(p.mode)}</td><td>${p.mode==='CHEQUE'?E(p.chequeNo+' · '+p.bank):'—'}</td><td class="num amt">${inr(p.amount)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">Nothing waiting to be deposited in this period.</td></tr>'}</tbody></table></div>
   ${sc&&und.length?`<form data-form="deposit" class="form" style="margin-top:14px"><div class="field span"><b id="depSum">Selected: ${und.length} · ${inr(sum(und,p=>p.amount))}</b></div>${F('depositedOn','Deposited on',{type:'date',val:today(),req:true,attrs:`max="${today()}"`})}${F('bankRef','Bank slip / reference',{req:true,attrs:'maxlength="60"'})}<div class="actions span"><button class="btn primary big">Mark as deposited</button><button type="button" class="btn" data-act="depPrint">Print report</button></div></form>`:`<div class="actions" style="margin-top:12px"><button class="btn" data-act="depPrint">Print report</button></div>`}
  </div>
  <div class="panel" style="margin-top:16px"><h2>Deposits made</h2><div class="tablewrap"><table><thead><tr><th>Deposited on</th><th>Period</th><th>Entries</th><th class="num">Total</th><th>Bank ref</th><th>By</th><th></th></tr></thead><tbody>
   ${db.deposits.slice().sort((a,b)=>b.at-a.at).map(d=>`<tr><td>${fmtD(d.depositedOn)}</td><td>${fmtD(d.periodFrom)} – ${fmtD(d.periodTo)}</td><td>${d.count}</td><td class="num amt">${inr(d.total)}</td><td>${E(d.bankRef)}</td><td>${E(d.by)}</td><td>${['Super Admin','Principal'].includes(cur().role)?`<button class="btn sm" data-act="depUndo" data-id="${E(d.id)}">Undo</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No deposits yet.</td></tr>'}</tbody></table></div></div>`;
}

if('serviceWorker' in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
/* =====================================================================
   Install as an app (PWA) — for every login and on the sign-in screen.
   Phone: a banner + a button in the top bar. Computer (Chrome / Edge): an
   "Install app" button that adds a desktop icon; the app then opens in its
   own window and keeps working offline (data is in this browser).
   ===================================================================== */
let deferredInstall=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: window-controls-overlay)').matches||navigator.standalone===true;
const isIOS=()=>/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isAndroid=()=>/Android/i.test(navigator.userAgent);
const isMobileDevice=()=>isIOS()||isAndroid()||/Mobi/i.test(navigator.userAgent);
const isMacSafari=()=>/Macintosh/.test(navigator.userAgent)&&/Safari\//.test(navigator.userAgent)&&!/Chrome|Chromium|Edg\//.test(navigator.userAgent)&&!isIOS();
const isEdge=()=>/Edg\//.test(navigator.userAgent);
/* how this browser can install: prompt (one tap) | ios | android-manual | mac-safari | none */
function installMode(){
  if(isStandalone())return'none';
  if(deferredInstall)return'prompt';
  if(isIOS())return'ios';
  if(isMobileDevice())return'android-manual';
  if(isMacSafari())return'mac-safari';
  return'none'; /* desktop Chrome / Edge show the button as soon as the browser says the app can be installed */
}
const HIDE_KEY='npcte_install_hide_until';
const bannerHidden=()=>+(lsGet(HIDE_KEY)||0)>Date.now();
const ICON_INSTALL=IC('<path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/>');
function installCard(where){
  const mob=isMobileDevice();
  const title=mob?'Install the NPCTE app':'Install NPCTE on this computer';
  const sub=mob?'Home-screen app, full screen, with alerts.':'Adds a desktop icon. Opens in its own window and works offline.';
  return`<div class="installbar ib-${where}" role="region" aria-label="Install the app"><div class="seal" aria-hidden="true">N</div><div><b>${title}</b><small>${sub}</small></div>
   <button class="btn primary sm" type="button" data-act="installApp">${ICON_INSTALL}<span>Install</span></button>${where==='login'?'':`<button class="iconbtn" type="button" data-act="installHide" aria-label="Hide for a week" title="Hide">${ICON_X}</button>`}</div>`;
}
function renderInstallUI(){
  const mode=installMode(),can_=mode!=='none';
  const tb=$('#tbInstall');if(tb)tb.innerHTML=can_?`<button class="iconbtn instbtn" type="button" data-act="installApp" title="Install app" aria-label="Install app">${ICON_INSTALL}<span class="lbl">Install app</span></button>`:'';
  const lg=$('#loginInstall');if(lg)lg.innerHTML=can_?installCard('login'):'';
  /* inside the app the banner shows on phones only (the top-bar button is there on every screen) */
  const sl=$('#installSlot');if(sl)sl.innerHTML=can_&&isMobileDevice()&&!bannerHidden()?installCard('app'):'';
  const pf=$('#profileInstall');if(pf)pf.innerHTML=installPanelHtml();
}
function installPanelHtml(){
  if(isStandalone())return`<p class="note" style="margin:0">You are using the installed app.</p>`;
  return`<p class="note" style="margin:0 0 8px">${isMobileDevice()?'Put NPCTE on your home screen to open it like an app.':'Add NPCTE to this computer: desktop icon, its own window, works offline.'}</p><button class="btn" type="button" data-act="installApp">${ICON_INSTALL} Install as app</button>`;
}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;renderInstallUI()});
addEventListener('appinstalled',()=>{deferredInstall=null;renderInstallUI();toast('NPCTE app installed. Open it from your '+(isMobileDevice()?'home screen':'desktop or Start menu')+'.');if(cur())setTimeout(()=>typeof askNotifyGently==='function'&&askNotifyGently(),800)});
try{matchMedia('(display-mode: standalone)').addEventListener('change',renderInstallUI)}catch(e){}
ACT.installHide=()=>{lsSet(HIDE_KEY,String(Date.now()+7*864e5));renderInstallUI();toast('Hidden. The Install button stays in the top bar.')};
ACT.installApp=async()=>{
  if(isStandalone()){toast('You are already using the installed app');return}
  if(deferredInstall){const ev_=deferredInstall;deferredInstall=null;ev_.prompt();const r=await ev_.userChoice.catch(()=>({}));renderInstallUI();if(r&&r.outcome==='accepted')toast('Installing NPCTE…');return}
  const mode=installMode();
  const steps=mode==='ios'?`<ol class="steps-ol"><li>Open this page in <b>Safari</b> (on iPhone 16.4+ Chrome also works).</li><li>Tap the <b>Share</b> button (square with an arrow).</li><li>Tap <b>Add to Home Screen</b>, then <b>Add</b>.</li></ol>`
   :mode==='android-manual'?`<ol class="steps-ol"><li><b>Chrome:</b> tap <b>⋮</b> at the top right → <b>Install app</b> (or <b>Add to Home screen</b>).</li><li><b>Samsung Internet:</b> tap <b>☰</b> → <b>Add page to</b> → <b>Home screen</b>.</li></ol>`
   :mode==='mac-safari'?`<ol class="steps-ol"><li>In the Safari menu bar choose <b>File → Add to Dock</b>.</li><li>Click <b>Add</b>. NPCTE opens from the Dock in its own window.</li></ol>`
   :isEdge()?`<ol class="steps-ol"><li>Click <b>…</b> at the top right → <b>Apps</b> → <b>Install this site as an app</b>.</li><li>Tick <b>Create desktop shortcut</b> if asked.</li></ol>`
   :`<ol class="steps-ol"><li><b>Chrome:</b> click the install icon at the right end of the address bar, or <b>⋮</b> → <b>Cast, save and share</b> → <b>Install page as app</b>.</li><li><b>Edge:</b> <b>…</b> → <b>Apps</b> → <b>Install this site as an app</b>.</li><li>Firefox cannot install apps; use Chrome or Edge.</li></ol>`;
  dialog(`<h3>Install NPCTE</h3>${steps}<p class="note">After installing, open NPCTE from your ${isMobileDevice()?'home screen':'desktop, Start menu or Dock'} and sign in once.</p><div class="actions" style="justify-content:flex-end;margin-top:10px"><button class="btn primary" data-act="closeDialog">OK</button></div>`,'Install the app');
