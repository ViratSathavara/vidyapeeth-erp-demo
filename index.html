<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Vidyapeeth ERP Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body>
<style>
/* Layout: login split screen; app = left rail + top bar + one working canvas (side drawers for detail). Two themes: light and dark. */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --sunk:#eef0f4; --line:#e2e5ea;
  --fg:#0f172a; --muted:#5b6472;
  --accent:#2563eb; --accent-soft:#e8f0fe; --accent-fg:#ffffff;
  --marigold:#2563eb; --marigold-soft:#eef4ff;
  --good:#15803d; --good-soft:#dcfce7; --warn:#b45309; --warn-soft:#fef3c7; --bad:#b91c1c; --bad-soft:#fee2e2;
  --rail:#ffffff; --rail-fg:#475569; --rail-hover:#f1f5f9; --rail-active:#e8f0fe; --rail-active-fg:#1d4ed8; --rail-line:#e2e5ea; --rail-strong:#0f172a;
  --art:#172554; --art-fg:#c7d2fe; --art-strong:#ffffff;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.08);
  --display:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0f17; --surface:#131a26; --sunk:#1a2231; --line:#263043; --fg:#e6eaf2; --muted:#94a0b4;
  --accent:#60a5fa; --accent-soft:#172a4d; --accent-fg:#0b1220; --marigold:#60a5fa; --marigold-soft:#111d36;
  --good:#4ade80; --good-soft:#12301f; --warn:#fbbf24; --warn-soft:#3a2c0c; --bad:#f87171; --bad-soft:#3b1717;
  --rail:#0f1520; --rail-fg:#9aa6ba; --rail-hover:#182131; --rail-active:#172a4d; --rail-active-fg:#93c5fd; --rail-line:#263043; --rail-strong:#e6eaf2;
  --art:#0a1020; --art-fg:#9aa6ba; --art-strong:#e6eaf2;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0f17; --surface:#131a26; --sunk:#1a2231; --line:#263043; --fg:#e6eaf2; --muted:#94a0b4;
  --accent:#60a5fa; --accent-soft:#172a4d; --accent-fg:#0b1220; --marigold:#60a5fa; --marigold-soft:#111d36;
  --good:#4ade80; --good-soft:#12301f; --warn:#fbbf24; --warn-soft:#3a2c0c; --bad:#f87171; --bad-soft:#3b1717;
  --rail:#0f1520; --rail-fg:#9aa6ba; --rail-hover:#182131; --rail-active:#172a4d; --rail-active-fg:#93c5fd; --rail-line:#263043; --rail-strong:#e6eaf2;
  --art:#0a1020; --art-fg:#9aa6ba; --art-strong:#e6eaf2;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
a{color:var(--accent)}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}
.right{text-align:right}
.hide{display:none!important}

/* ---------- login ---------- */
.login{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.login-art{background:var(--art);color:var(--art-fg);padding:48px max(32px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.login-art h1{font-size:32px;line-height:1.15;letter-spacing:-.02em;font-weight:700;color:var(--art-strong);margin:18px 0 12px}
.login-art p{max-width:42ch;margin:0}
.seal{width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.login-art .points{display:grid;gap:10px;font-size:13px}
.login-art .points span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--art-strong);opacity:.7;margin-right:10px;vertical-align:2px}
.login-form{padding:48px max(32px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;justify-content:center;gap:22px;max-width:560px;width:100%;margin:0 auto}
.login-form h2{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0}
.demo-accts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.acct{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.acct:hover{border-color:var(--accent)}
.acct:focus-visible{outline:2px solid var(--accent)}
.acct b{font-size:13px}
.acct small{color:var(--muted)}
.err{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:8px 12px;font-weight:600}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}.app>*{min-width:0}
.rail{background:var(--rail);color:var(--rail-fg);border-right:1px solid var(--rail-line);padding:18px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand .seal{width:36px;height:36px;font-size:17px}
.brand b{color:var(--rail-strong);font-weight:700;font-size:14px;line-height:1.15;display:block}
.brand small{font-size:11px;opacity:.75}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;box-sizing:border-box;cursor:pointer;padding:9px 12px;border-radius:8px;display:flex;gap:10px;align-items:center;font-weight:500;width:100%}
.nav button:hover{background:var(--rail-hover)}
.nav button[aria-current="page"]{background:var(--rail-active);color:var(--rail-active-fg);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .badge{margin-left:auto;background:var(--accent);color:var(--accent-fg);border-radius:99px;font-size:11px;font-weight:700;padding:0 7px}
.rail-foot{margin-top:auto;font-size:12px;padding:10px 6px 0;border-top:1px solid var(--rail-line)}
main{min-width:0;padding-block:0 56px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.topbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:14px 0;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 14px 4px 4px}
.chip .av{width:30px;height:30px}
.chip small{display:block;color:var(--muted);line-height:1.1}
.chip b{line-height:1.2}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;cursor:pointer;font-weight:600}
.iconbtn:hover{border-color:var(--accent)}
.iconbtn.tb{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}.iconbtn .ic{flex:none}

/* ---------- common ---------- */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.2}
.top p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.pill{height:fit-content;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.gold{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 10px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.panel h2{font-size:15px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.panel h3{font-size:14px;margin:16px 0 6px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.grid{display:grid;gap:16px}
.two{grid-template-columns:1.5fr 1fr}.even{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:repeat(3,1fr)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.kpi .v{font-size:24px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.tablewrap{overflow-x:auto;background:linear-gradient(90deg,var(--surface) 30%,transparent) 0 0/36px 100% no-repeat local,linear-gradient(270deg,var(--surface) 30%,transparent) 100% 0/36px 100% no-repeat local,radial-gradient(farthest-side at 0 50%,rgba(15,23,42,.2),transparent) 0 0/9px 100% no-repeat scroll,radial-gradient(farthest-side at 100% 50%,rgba(15,23,42,.2),transparent) 100% 0/9px 100% no-repeat scroll}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--sunk)}
td.num,th.num{text-align:right}
.who{display:flex;gap:10px;align-items:center}
.av{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.warn i{background:var(--warn)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;resize:vertical}
.filters input[type=search]{flex:1;min-width:180px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field input,.field select,.field textarea{width:100%}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.form .span{grid-column:1/-1}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li small{color:var(--muted);display:block}
.amt{font-weight:700;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.empty{text-align:center;color:var(--muted);padding:28px}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px;margin-bottom:16px;overflow-x:auto}
.tabs button{flex:none;border:0;background:transparent;padding:8px 14px;border-radius:7px;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.steps{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.steps em{color:var(--muted);font-style:normal}
.steps .pill.cur{background:var(--accent);color:var(--accent-fg)}
.rline{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.rline.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:700}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--sunk)}
.stack i{display:block;height:100%}
.crow{display:grid;grid-template-columns:70px 1fr 56px;gap:10px;align-items:center}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 0}
.facts b{display:block;font-weight:600;overflow-wrap:anywhere}
.matrix td,.matrix th{text-align:center}.matrix td:first-child,.matrix th:first-child{text-align:left}
.matrix input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.hl{background:var(--marigold-soft);border:1px solid var(--marigold);border-radius:10px;padding:12px 14px}
.flow{display:flex;gap:16px;flex-wrap:wrap;align-items:center;border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--bg)}
.qr{width:132px;height:132px;border-radius:8px;overflow:hidden;flex:none;border:1px solid var(--line)}
.receipt{border:1.5px dashed var(--line);border-radius:10px;padding:16px;background:var(--bg)}
.receipt .hd{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:10px}
.receipt .hd b{font-size:15px}
.cancelled{text-decoration:line-through;color:var(--muted)}
.bubble{background:var(--good-soft);border-radius:12px 12px 12px 2px;padding:10px 12px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:520px}
.sheet{width:100%;max-width:340px;margin:0 auto;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:18px;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.csvbox{font-family:var(--mono);font-size:12px;min-height:220px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}

/* drawer + dialogs */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.5);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:41;overflow-y:auto;
  padding-top:max(22px,env(safe-area-inset-top,0px));padding-bottom:max(22px,env(safe-area-inset-bottom,0px));
  padding-left:22px;padding-right:max(22px,env(safe-area-inset-right,0px));box-shadow:-10px 0 40px rgba(0,0,0,.25)}
.drawer.wide{width:min(760px,100%)}
.drawer h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
.x{float:right}
.dialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;z-index:55;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dialog h3{margin:0 0 6px;font-size:17px;font-weight:700}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:600;z-index:70;max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}

@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:1fr}}
@media (max-width:1180px){.two{grid-template-columns:1fr}}
.two.onecol{grid-template-columns:1fr}
@media (max-width:820px){
  .login{grid-template-columns:1fr}
  .login-art{padding-block:28px}.login-art h1{font-size:28px}
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{border-right:0;border-bottom:1px solid var(--rail-line);position:sticky;top:env(safe-area-inset-top,0px);height:auto;padding:10px 0 0;gap:6px;z-index:20;overflow:visible}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--rail)}
  .brand{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .nav{flex-direction:row;overflow-x:auto;padding:0 max(12px,env(safe-area-inset-left,0px)) 8px;scrollbar-width:none}
  .nav button{white-space:nowrap;padding:8px 10px;width:auto}
  .rail-foot{display:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .form,.even,.demo-accts{grid-template-columns:1fr}
  .facts{grid-template-columns:1fr 1fr}
  .topbar{flex-wrap:nowrap;gap:6px;justify-content:flex-end}.topbar .iconbtn{padding:7px 10px;font-size:12px;white-space:nowrap}.topbar .chip{min-width:0;flex:1;padding:4px 8px}.topbar .chip small{display:none}.topbar .chip b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}.topbar .chip>div:last-child{min-width:0}
}
@media (max-width:520px){.kpis{grid-template-columns:1fr}.top h1{font-size:24px}}
/* phones: top bar buttons become icons so the name always fits */
@media (max-width:560px){.topbar .iconbtn.tb .lbl{display:none}.topbar .iconbtn.tb,.topbar .bell{width:40px;height:40px;min-height:40px;padding:0;justify-content:center;flex:none}.topbar .chip{min-width:0}}

/* =====================================================================
   Motion layer. Everything below is switched off for people who ask their
   device for reduced motion.
   ===================================================================== */
:root{--ease:cubic-bezier(.22,1,.36,1);--ease-soft:cubic-bezier(.4,0,.2,1)}
.topbar{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);margin-inline:calc(-1*max(28px,env(safe-area-inset-left,0px)));padding-inline:max(28px,env(safe-area-inset-left,0px))}
.kpi,.acct{position:relative;overflow:hidden}
.kpi::after,.acct::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%)}
.kpi:hover::after,.acct:hover::after{opacity:1}
.chip .av,.seal{box-shadow:0 0 0 0 transparent}
.receipt .tick{display:flex;align-items:center;gap:10px;margin:0 0 10px;color:var(--good);font-weight:700}
.receipt .tick svg{width:30px;height:30px;flex:none}
.receipt .tick circle{fill:var(--good-soft);stroke:var(--good);stroke-width:2}
.receipt .tick path{fill:none;stroke:var(--good);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.login-art{position:relative;overflow:hidden;isolation:isolate}
.login-art>*{position:relative;z-index:1}
.login-art::before,.login-art::after{content:"";position:absolute;z-index:0;border-radius:50%;filter:blur(60px);opacity:.55;pointer-events:none}
.login-art::before{width:380px;height:380px;background:#3b82f6;top:-120px;right:-120px}
.login-art::after{width:320px;height:320px;background:#6366f1;bottom:-120px;left:-80px}

@media (prefers-reduced-motion:no-preference){
  .btn,.iconbtn,.tabs button,.nav button,.acct,.pill,input,select,textarea{transition:background-color .2s var(--ease-soft),color .2s var(--ease-soft),border-color .2s var(--ease-soft),box-shadow .2s var(--ease-soft),transform .18s var(--ease)}
  .btn:hover,.iconbtn:hover{transform:translateY(-1px);box-shadow:0 4px 12px color-mix(in srgb,var(--fg) 10%,transparent)}
  .btn:active,.iconbtn:active,.acct:active,.nav button:active{transform:scale(.97);box-shadow:none}
  .btn.primary:hover{box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent);outline:none}
  .kpi,.panel{transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s var(--ease-soft)}
  .kpi:hover{transform:translateY(-3px);box-shadow:0 10px 28px color-mix(in srgb,var(--fg) 10%,transparent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
  .nav button:hover{transform:translateX(2px)}
  tbody tr{transition:background-color .15s var(--ease-soft)}
  tbody tr:hover td{background:color-mix(in srgb,var(--accent) 6%,transparent)}
  tr.click:hover td{background:color-mix(in srgb,var(--accent) 8%,transparent)}
  .tabs button[aria-selected="true"]{animation:pop .28s var(--ease)}

const lsDel=k=>{try{localStorage.removeItem(k)}catch(e){delete memStore[k]}};
/* The signed-in user lives in sessionStorage, so two browser tabs can hold two different logins at once. Data lives in localStorage and is synced between tabs. */

/* ---------- fee engine ---------- */
function planFor(total,planName,start){
  const t=db.plans.find(p=>p.name===planName)||db.plans[0];const off=db.settings.dueOffsets;let used=0;
  return t.pct.map((p,i)=>{const a=i===t.pct.length-1?total-used:Math.round(total*p/100);used+=a;
    return{label:t.pct.length===1?'Full payment':'Installment '+(i+1),amt:a,due:addDays(start,off[i]!==undefined?off[i]:off[off.length-1]+30*i)}});
}
function layoutFee(f){
  let heads=[];if(f.prev>0)heads.push({name:'Previous balance',amount:f.prev});
  heads=heads.concat(f.base.map(h=>({name:h.name,amount:h.amount})));
  const c=f.concession;f.govReceivable=0;
  if(c.status==='approved'){const ti=heads.findIndex(h=>h.name===f.base[0].name);
    if(c.type==='gov'){f.govReceivable=heads[ti].amount;heads[ti].amount=0}
    else if(c.type==='mgmt'){heads[ti].amount-=Math.min(c.amount,heads[ti].amount)}}
  f.heads=heads;f.total=sum(heads,h=>h.amount);f.plan=planFor(f.total,f.planName,f.start);
}
function newFee({sem,courseId,planName,start,concession,prev}){
  const f={id:uid('f'),sem,base:db.feeStructure[courseId].map(h=>({...h})),planName,start,concession:concession||{type:'none',amount:0,status:'none'},prev:prev||0,paid:0,paidLate:0,lateWaived:0,cleared:[],govReceivable:0};
  layoutFee(f);f.cleared=f.plan.map(()=>null);return f;
}
function lateAt(f,onDate,paid,cleared){
  const{lateFeePerDay:pd,lateCap:cap,graceDays:g}=db.settings;let cum=0,tot=0;
  f.plan.forEach((p,i)=>{cum+=p.amt;if(p.amt<=0)return;const end=cleared[i]||onDate;const days=diffDays(end,p.due)-g;if(days>0)tot+=Math.min(cap,days*pd)});
  return tot;
}
function recompute(s){
  const f=s.fee;const pays=db.payments.filter(p=>p.studentId===s.id&&p.feeId===f.id&&p.status==='ok').sort((a,b)=>a.ts-b.ts);
  let paid=0,paidLate=0;const cleared=f.plan.map(()=>null);
  for(const p of pays){
    const late=lateAt(f,p.date,paid,cleared);const lateDue=Math.max(0,late-f.lateWaived-paidLate);
    const la=Math.min(p.amount,lateDue);const fa=Math.min(p.amount-la,Math.max(0,f.total-paid));
    const alloc=[];let skip=paid,left=fa;
    f.heads.forEach(h=>{const before=Math.min(h.amount,skip);skip-=before;const take=Math.min(h.amount-before,left);left-=take;alloc.push({name:h.name,amount:h.amount,before,applied:take,after:before+take})});
    paid+=fa;paidLate+=la;p.balAfter=Math.max(0,f.total-paid);p.paidAfter=paid;p.late=la;p.feeAmt=fa;p.credit=p.amount-la-fa;p.alloc=alloc;
    let cum=0;f.plan.forEach((pl,i)=>{cum+=pl.amt;if(!cleared[i]&&pl.amt>0&&paid>=cum)cleared[i]=p.date});
  }
  f.paid=paid;f.paidLate=paidLate;f.cleared=cleared;
}
function feeSum(s,on){
  on=on||today();const f=s.fee;const late=lateAt(f,on,f.paid,f.cleared);
  const lateDue=Math.max(0,late-f.lateWaived-f.paidLate);const balance=Math.max(0,f.total-f.paid);let cum=0;
  const inst=f.plan.map(p=>{cum+=p.amt;const state=p.amt<=0||f.paid>=cum?'Paid':(f.paid>cum-p.amt?'Part-paid':'Due');
    return{...p,cum,state,overdue:state!=='Paid'&&diffDays(on,p.due)>0,remaining:Math.max(0,Math.min(p.amt,cum-f.paid))}});
  const payable=balance+lateDue;const nextInst=inst.find(i=>i.state!=='Paid');
  return{total:f.total,paid:f.paid,balance,late,lateDue,payable,inst,nextInst,overdue:inst.some(i=>i.overdue),
    status:payable<=0?'Paid':(f.paid===0&&f.paidLate===0?'Not paid':'Partial'),suggest:(nextInst?nextInst.remaining:0)+lateDue};
}
function recordPayment(s,o){
  const date=o.date||today();const sm=feeSum(s,date);
  if(!(o.amount>0))throw new Error('Enter an amount above ₹0');
  if(o.amount>sm.payable)throw new Error(`Amount is more than the payable ${inr(sm.payable)}`);
  if(o.channel==='counter'&&db.closures[date]&&!o.force)throw new Error('Today is closed. Ask the Principal to reopen the day.');
  const p={id:uid('p'),rc:db.settings.receiptPrefix+(db.counters.rc++),studentId:s.id,feeId:s.fee.id,sem:s.fee.sem,date,ts:o.ts||Date.now(),
    amount:o.amount,mode:o.mode,channel:o.channel,ref:o.ref||'',by:o.by||'System',status:'ok',settle:o.channel==='online'?{status:o.settle||'pending'}:null};
  db.payments.push(p);recompute(s);return p;
}
function cancelPayment(p,reason,refundMode){
  const s=stu(p.studentId);if(p.feeId!==s.fee.id)throw new Error('Only this semester\'s receipts can be cancelled');
  p.status='cancelled';p.cancel={reason,by:cur().name,ts:Date.now(),refundMode};recompute(s);
  db.refunds.push({id:uid('r'),rc:p.rc,studentId:p.studentId,amount:p.amount,mode:refundMode,date:today(),reason,by:cur().name});
}
const paysOf=(s,okOnly=true)=>db.payments.filter(p=>p.studentId===s.id&&(!okOnly||p.status==='ok')).sort((a,b)=>b.ts-a.ts);
function cashExpected(date){
  const cash=sum(db.payments.filter(p=>p.channel==='counter'&&p.mode==='Cash'&&p.date===date),p=>p.amount); /* cancelled receipts still count: the cash was received; the refund below takes it back out */
  const ref=sum(db.refunds.filter(r=>r.date===date&&r.mode==='Cash'),r=>r.amount);return cash-ref;
}
function attPct(s){
  let p=0,t=0;Object.values(db.attendance).forEach(day=>{const r=day[s.div];if(r&&r.sem===s.sem&&r.marks[s.id]){t++;if(r.marks[s.id]==='P')p++}});
  return t?Math.round(p/t*100):null;
}
function nextEnrol(courseId,batchId){
  const c=course(courseId),b=batchOf(batchId);const pre=c.code+pad(b.startYear%100);
  db.counters.enrol[pre]=(db.counters.enrol[pre]||0)+1;return pre+'-'+pad(db.counters.enrol[pre],3);

/* ---------- tables become cards on phones: label every cell with its column name ---------- */
function labelTables(root=document){
  $$('table',root).forEach(t=>{
    const heads=$$('thead th',t).map(h=>h.textContent.trim());
    $$('tbody tr:not([data-l])',t).forEach(tr=>{
      tr.dataset.l='1';const tds=[...tr.children].filter(c=>c.tagName==='TD'||c.tagName==='TH');let col=0;
      tds.forEach(td=>{
        const span=td.colSpan||1;
        td.dataset.label=span>1?'':(heads[col]||'');col+=span;
        const txt=td.textContent.trim();
        const hasUi=td.querySelector('input,select,textarea,button,svg,img,.bar,.stack');
        if(!txt&&!hasUi)td.dataset.empty='1';
        else if(!txt&&td.querySelector('input[type=checkbox]')&&!td.querySelector('button'))td.dataset.check='1';
        else if(!td.dataset.label&&td.querySelector('button')&&span===1&&!td.querySelector('input,select'))td.dataset.actions='1';
      });
      if(tds.length>=5)tr.dataset.many='1';
      const prim=tr.querySelector('.who')?.closest('td')||tds.find(td=>!td.dataset.check&&!td.dataset.empty&&!td.dataset.actions&&td.dataset.label!==undefined);
      if(prim&&tds.length>1)prim.dataset.primary='1';
    });
  });
}
new MutationObserver(()=>labelTables()).observe(document.documentElement,{childList:true,subtree:true});
document.addEventListener('DOMContentLoaded',()=>labelTables());

/* ---------- motion helpers ---------- */
const calm=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
function playEnter(kind){
  const pg=$('#page');if(!pg||calm())return;
  pg.classList.remove('enter','swap');void pg.offsetWidth;pg.classList.add(kind);clearTimeout(pg._t);pg._t=setTimeout(()=>pg.classList.remove('enter','swap'),1100);
  if(kind==='enter')countUp(pg);
}
function countUp(root){
  $$('.kpi .v',root).forEach(el=>{
    const txt=el.textContent.trim();if(!/^₹?[\d,]+$/.test(txt))return;
    const rupee=txt[0]==='₹';const target=+txt.replace(/[^\d]/g,'');if(!target)return;
    const t0=performance.now(),dur=900,fmt=n=>(rupee?'₹':'')+Math.round(n).toLocaleString('en-IN');
    const step=now=>{const k=Math.min(1,(now-t0)/dur);const e=1-Math.pow(1-k,3);el.textContent=k<1?fmt(target*e):txt;if(k<1)requestAnimationFrame(step)};
    el.textContent=fmt(0);requestAnimationFrame(step);
  });
}
document.addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.kpi,.acct');if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px')},{passive:true});

/* ---------- dashboard ---------- */
const live=()=>db.students.filter(s=>s.status==='Active');
function dueList(){return live().map(s=>({s,sm:feeSum(s)})).filter(x=>x.sm.payable>0).sort((a,b)=>b.sm.payable-a.sm.payable)}
function todayTotals(){const T=today();const ok=db.payments.filter(p=>p.status==='ok'&&p.date===T);return{online:sum(ok.filter(p=>p.channel==='online'),p=>p.amount),cash:sum(ok.filter(p=>p.mode==='Cash'),p=>p.amount),cheque:sum(ok.filter(p=>p.mode==='Cheque / DD'),p=>p.amount),count:ok.length}}
function myDivisions(){const u=cur();if(u.role!=='Faculty')return db.divisions;
  return db.divisions.filter(d=>d.teacher===u.staffId||db.subjects.some(s=>s.faculty===u.staffId&&s.course===d.course&&db.students.some(st=>st.div===d.id&&st.sem===s.sem)))}
function alertsFor(){
  const A=[];const T=today();
  const pend=db.students.filter(s=>s.fee.concession.status==='pending');
  if(can('fees.concession.approve')&&pend.length)A.push(['warn',`${pend.length} concession request${pend.length>1?'s':''} waiting`,'Open Fee Collection, then Approvals','fees','approvals']);
  if(can('fees.dayclose')&&!db.closures[T]&&db.payments.some(p=>p.date===T&&p.status==='ok'&&p.channel==='counter'))A.push(['warn','Today\'s cash is not closed yet','Count the drawer and close the day','fees','dayclose']);
  const unm=db.payments.filter(p=>p.settle&&p.settle.status==='pending'&&p.status==='ok'&&p.date<T).length;
  if(can('fees.bankmatch')&&unm)A.push(['warn',`${unm} online payment${unm>1?'s':''} waiting for bank match`,'Import the settlement to match them','fees','bank']);
  const prov=live().filter(s=>docsMissing(s)).length;
  if(can('students.edit')&&prov)A.push(['bad',`${prov} students with required documents pending`,'Admission stays provisional until verified','students','']);
  const low=live().filter(s=>{const p=attPct(s);return p!==null&&p<75}).length;
  if(canAny('attendance.view')&&low)A.push(['bad',`${low} students below 75% attendance`,'See the attendance register','attendance','register']);
  if(can('attendance.mark')){const mine=myDivisions().filter(d=>!(db.attendance[T]&&db.attendance[T][d.id]));if(mine.length&&parseD(T).getDay()!==0)A.push(['warn',`Attendance not marked today for ${mine.length} division${mine.length>1?'s':''}`,'Mark attendance','attendance','mark'])}
  if(can('fees.view')){const od=dueList().filter(x=>x.sm.overdue).length;if(od)A.push(['bad',`${od} students have overdue installments`,'Send reminders from Messages','messages','remind'])}
  return A;
}
function viewDashboard(){
  const u=cur(),T=today();const tt=todayTotals();const dl=dueList();const outst=sum(dl,x=>x.sm.payable);
  const collected=sum(live(),s=>s.fee.paid+s.fee.paidLate);
  let kp;
  if(u.role==='Faculty')kp=[['My divisions',myDivisions().length,'Classes you teach or lead'],['Students',db.students.filter(s=>myDivisions().some(d=>d.id===s.div)).length,'In your divisions'],
    ['Below 75% attendance',db.students.filter(s=>myDivisions().some(d=>d.id===s.div)&&attPct(s)!==null&&attPct(s)<75).length,'Needs a word with the student'],['Subjects',db.subjects.filter(s=>s.faculty===u.staffId).length,'Assigned to you']];

  else if(u.role==='Clerk')kp=[['Students',live().length,'Active admissions'],['Documents pending',live().filter(s=>docsMissing(s)).length,'Provisional admissions'],['Receipts today',tt.count,'Issued so far'],['Outstanding',inr(outst),dl.length+' students']];
  else kp=[['Students enrolled',live().length,`${live().filter(s=>s.course==='bed').length} B.Ed · ${live().filter(s=>s.course==='med').length} M.Ed`],['Fees collected',inr(collected),'This semester, all courses'],['Outstanding dues',inr(outst),dl.length+' students pending'],['Staff on roll',db.staff.filter(s=>s.status!=='Left').length,`${db.staff.filter(s=>s.role==='Faculty').length} teaching`]];
  const showFees=can('fees.view');const al=alertsFor();
  const byCourse=db.courses.map(c=>{const l=live().filter(s=>s.course===c.id);const tot=sum(l,s=>s.fee.total),pd=sum(l,s=>s.fee.paid);return{c,tot,pd}});
  const acts=(can('students.edit')?'<button class="btn" data-act="newAdmission">Add student</button>':'')+(can('fees.collect')?'<button class="btn primary" data-act="nav" data-id="fees">Collect fee</button>':'')+(can('attendance.mark')?'<button class="btn primary" data-act="nav" data-id="attendance">Mark attendance</button>':'');
  const greet=new Date().getHours()<12?'Good morning':new Date().getHours()<17?'Good afternoon':'Good evening';
  return head(`${greet}, ${u.name.replace(/^(Dr\.|Prof\.)\s/,'').split(' ')[0]}`,`${db.settings.college} · ${fmtD(T)}`,acts)+
  `<div class="kpis">${kp.map(k=>`<div class="kpi"><span class="label">${E(k[0])}</span><div class="v">${E(k[1])}</div><div class="s">${E(k[2])}</div></div>`).join('')}</div>
  <div class="grid two"><div class="grid" style="align-content:start">
   ${showFees?`<div class="panel"><h2>Fee collection by course ${pill(db.settings.year,'acc')}</h2><div class="grid" style="gap:12px">${byCourse.map(b=>`<div class="crow"><b>${E(b.c.name)}</b><div class="stack"><i style="width:${b.tot?b.pd/b.tot*100:0}%;background:var(--accent)"></i></div><span class="amt right">${b.tot?Math.round(b.pd/b.tot*100):0}%</span></div><div class="note" style="margin:-6px 0 0 80px">${inr(b.pd)} of ${inr(b.tot)}</div>`).join('')}</div>

function parseCsv(t){const rows=[];let row=[],cur='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'&&t[i+1]==='"'){cur+='"';i++}else if(c==='"')q=false;else cur+=c}else if(c==='"')q=true;else if(c===','){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()))rows.push(row);row=[]}else cur+=c}row.push(cur);if(row.some(x=>x.trim()))rows.push(row);return rows}
FORM.importCsv=(f,d)=>{
  if(!can('students.edit'))throw new Error('You do not have access to import');
  const rows=parseCsv(d.csv);const hdr=rows.shift().map(h=>h.trim().toLowerCase());const ix=n=>hdr.indexOf(n);
  ['name','course','batch','division','mobile'].forEach(n=>{if(ix(n)<0)throw new Error('Missing column: '+n)});
  const ok=[],bad=[];
  rows.forEach((r,i)=>{const g=n=>(r[ix(n)]||'').trim();const c=db.courses.find(x=>x.name.toLowerCase()===g('course').toLowerCase());const b=c&&db.batches.find(x=>x.course===c.id&&x.name.replace('–','-')===g('batch').replace('–','-'));const dv=b&&db.divisions.find(x=>x.batch===b.id&&x.name.toLowerCase()===g('division').toLowerCase());
    if(!g('name')||!c||!b||!dv||g('mobile').replace(/\D/g,'').length<10){bad.push(`Row ${i+2}: ${g('name')||'(no name)'}, check course, batch, division and mobile`);return}
    if(seatsLeft(dv)<=0){bad.push(`Row ${i+2}: ${g('name')}, division ${dv.name} is full`);return}
    if(db.students.some(s=>s.name.toLowerCase()===g('name').toLowerCase()&&s.phone.replace(/\s/g,'')===g('mobile').replace(/\s/g,''))){bad.push(`Row ${i+2}: ${g('name')} already exists`);return}
    const s=makeStudent({name:g('name'),gender:g('gender')==='M'?'Male':'Female',course:c.id,batch:b.id,div:dv.id,sem:1,phone:g('mobile'),gname:g('guardian'),gphone:g('guardian_mobile'),gemail:g('guardian_email'),email:g('email'),docs:{},start:today()});
    db.students.push(s);ensureUsers(s);
    const paid=+g('paid_so_far')||0;if(paid>0){try{recordPayment(s,{amount:Math.min(paid,feeSum(s).payable),mode:'Imported',channel:'imported',by:cur().name,ref:'Opening balance'})}catch(e){}}
    ok.push(s)});
  log('Import',`${ok.length} students imported, ${bad.length} rows skipped`);save();renderPage();
  $('#impOut').innerHTML=`<div class="panel" style="margin-top:14px"><h2>${ok.length} imported ${bad.length?pill(bad.length+' skipped','warn'):''}</h2>${ok.map(s=>`<div class="li"><span>${E(s.name)}</span><span class="mono">${E(s.id)}</span></div>`).join('')}${bad.map(b=>`<p class="note" style="color:var(--bad)">${E(b)}</p>`).join('')}</div>`;
  toast(ok.length+' students imported');
};

function tpl(kind,s,x={}){
  const sm=feeSum(s),clg=db.settings.short,link='pay.vidyapeeth.example/'+s.id.toLowerCase();
  if(kind==='reminder')return`Dear ${s.guardian.name}, ${inr(sm.payable)} fee for ${s.name} (${s.id}) is due${sm.nextInst?' on '+fmtD(sm.nextInst.due):''}. Pay online: ${link} - ${clg}`;
  if(kind==='overdue'){const o=sm.inst.find(i=>i.overdue);return`Reminder: ${inr(sm.payable)} for ${s.name} was due on ${fmtD(o?o.due:today())}.${sm.lateDue?' Late fee of '+inr(sm.lateDue)+' applies.':''} Please pay to avoid more late fee: ${link} - ${clg}`}
  if(kind==='receipt')return`Payment received: ${inr(x.amount)} on ${fmtD(x.date)} for ${s.name}. Receipt ${x.rc}. Balance ${inr(x.bal)}. - ${clg}`;
  if(kind==='welcome')return`Welcome to ${db.settings.college}. Admission of ${s.name} is confirmed. Enrolment no. ${s.id}. Parent login: ${s.id.toLowerCase()} / parent123. Student login: stu-${s.id.toLowerCase()} / student123. - ${clg}`;
  if(kind==='link')return`Pay ${inr(x.amount)} fee for ${s.name}: pay.vidyapeeth.example/r/${x.id} - ${clg}`;
  return x.text||'';
}

/* ----- collect ----- */
function feeCollect(){
  const mode=ui.feeMode||'online';const online=mode==='online';
  const all=db.students.filter(s=>s.status==='Active').sort((a,b)=>a.name.localeCompare(b.name));
  if(!ui.pre||!all.find(s=>s.id===ui.pre))ui.pre=(dueList()[0]?.s||all[0]).id;

LIVE.feeSearch=el=>{const q=el.value.toLowerCase();const sel=$('#f_sid');let first=null;$$('option',sel).forEach(o=>{const m=!q||o.textContent.toLowerCase().includes(q);o.hidden=!m;o.disabled=!m;if(m&&!first)first=o});if(first&&sel.selectedOptions[0]?.hidden){sel.value=first.value}};
FORM.collect=(f,d)=>{
  if(!can('fees.collect'))throw new Error('You do not have access to collect fees');
  const s=stu(d.sid);const amount=+d.amount;const online=(ui.feeMode||'online')==='online';ui.pre=s.id;
  if(online){const sm=feeSum(s);if(!(amount>0))throw new Error('Enter an amount above ₹0');if(amount>sm.payable)throw new Error(`Amount is more than the payable ${inr(sm.payable)}`);
    const r={id:'rq'+(db.counters.req++),studentId:s.id,amount,mode:d.mode,status:'waiting',created:Date.now(),by:cur().name};db.requests.push(r);ui.req=r.id;ui.last=null;log('Payment request',`${inr(amount)} for ${s.name} via ${d.mode}`);save();renderPage();return}
  const p=recordPayment(s,{amount,mode:d.mode,channel:'counter',ref:d.ref,by:cur().name});ui.last=p.id;log('Payment received',`${p.rc}: ${inr(amount)} from ${s.name} (${d.mode})`);autoReceipt(p);save();toast(`${inr(amount)} received · ${p.rc}`);renderPage();
};
function autoReceipt(p){const s=stu(p.studentId);sendMsg('receipt',s,'WhatsApp',tpl('receipt',s,{amount:p.amount,date:p.date,rc:p.rc,bal:p.balAfter}));queueReceiptMail(p,{trigger:'auto'});notifyPayment(p,s)}
function notifyPayment(p,s){notify('payment',`${p.channel==='online'?'Online payment':'Payment'} received · ${p.rc}`,`${inr(p.amount)} from ${s.name} (${p.mode}). Balance ${inr(p.balAfter)}.`,{sid:s.id,tone:'good',go:{staff:['fees','receipts'],portal:'pfees'},p:{t:`Payment received · ${p.rc}`,x:`${inr(p.amount)} paid by ${p.mode}. Fee balance ${inr(p.balAfter)}. The PDF receipt is emailed to you.`}})}
function notifyPayFail(r){const s=stu(r.studentId);if(!s)return;notify('payfail','Online payment failed',`${inr(r.amount)} for ${s.name} was not completed. No receipt was issued.`,{sid:s.id,tone:'bad',go:{staff:['fees','dues'],portal:'pfees'},p:{t:'Your payment did not go through',x:`${inr(r.amount)} was not completed and you were not charged. You can try again from Fees and Receipts.`}})}
function notifyReminder(s,kind){const k=kind==='overdue'?'overdue':kind==='reminder'?'reminder':'other';notify('reminder',k==='overdue'?'Fee payment overdue':k==='reminder'?'Fee reminder':'Message from the college office',tpl(kind,s).slice(0,170),{sid:s.id,tone:k==='overdue'?'bad':k==='reminder'?'warn':'info',go:{portal:'pfees'},roles:['Parent','Student'].filter(r=>ntOn('reminder',r))})}
ACT.reqSend=el=>{const r=db.requests.find(x=>x.id===el.dataset.id);const s=stu(r.studentId);sendMsg('link',s,'WhatsApp',tpl('link',s,{amount:r.amount,id:r.id}));save();toast('Payment link sent to '+s.whatsapp)};
ACT.reqSim=el=>{

  <div class="hd"><div><b>${E(db.settings.college)}</b><br><small class="muted">Fee receipt · ${E(c.name)} Semester ${p.sem}</small></div><div class="right"><span class="mono">${E(p.rc)}</span><br><small class="muted">${fmtD(p.date)}</small></div></div>
  <div class="rline"><span>Student</span><span>${E(s.name)} (${E(s.id)})</span></div><div class="rline"><span>Paid by</span><span>${E(p.mode)}${p.ref?' · '+E(p.ref):''}</span></div>

  ${p.late>0?`<div class="rline"><span>Late fee cleared</span><span>${inr(p.late)}</span></div>`:''}
  <div class="rline tot"><span>Amount received</span><span>${inr(p.amount)}</span></div><div class="rline"><span>Fee balance after this payment</span><span>${inr(p.balAfter)}</span></div>
  <p style="margin:10px 0 0;display:flex;gap:6px;flex-wrap:wrap">${pill('Ledger updated','good')}${pill('Receipt number auto-issued','good')}${p.channel==='online'?pill('Matched with gateway','good'):p.mode==='Cash'?pill("Added to today's cash drawer",'warn'):''}</p></div>`;
}

FORM.concRequest=(f,d)=>{
  if(!(can('fees.concession.request')||can('fees.concession.approve')))throw new Error('You do not have access to concessions');
  const s=stu(d.sid);if(!s)throw new Error('Choose a student');const c=concFromKey(d.conc);const u=cur();const appr=can('fees.concession.approve');

/* ---------- PDF writer (A4, Helvetica, no libraries so it works offline) ---------- */
const HELV=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
function pdfSafe(t){
  return String(t??'').replace(/₹/g,'Rs. ').replace(/[–—]/g,'-').replace(/[·•]/g,'-').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/…/g,'...')
    .replace(/[^\x20-\x7e]/g,c=>{let n='';try{n=c.normalize('NFD').replace(/[̀-ͯ]/g,'')}catch(e){}return /^[\x20-\x7e]+$/.test(n)?n:'?'});
}
const pdfW=(t,size,bold)=>sum([...pdfSafe(t)],c=>HELV[c.charCodeAt(0)-32]||556)*size/1000*(bold?1.06:1);
const pdfEsc=t=>pdfSafe(t).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
function makePdf(draw,meta){
  const H=842,out=[];const col=h=>{const n=parseInt(h.slice(1),16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255].map(v=>v.toFixed(3)).join(' ')};
  const api={
    rect(x,y,w,h,fill){out.push(`${col(fill)} rg ${x} ${H-y-h} ${w} ${h} re f`)},
    line(x1,y1,x2,y2,stroke='#d7dce5',w=.8){out.push(`${col(stroke)} RG ${w} w ${x1} ${H-y1} m ${x2} ${H-y2} l S`)},
    text(x,y,t,o={}){const{size=10,bold=false,color='#1b2437',align='left'}=o;const w=pdfW(t,size,bold);const px=align==='right'?x-w:align==='center'?x-w/2:x;
      out.push(`BT /${bold?'F2':'F1'} ${size} Tf ${col(color)} rg ${px.toFixed(2)} ${(H-y).toFixed(2)} Td (${pdfEsc(t)}) Tj ET`)},
    stamp(t,o={}){const{size=70,color='#f3c4c4',x=300,y=470}=o;const w=pdfW(t,size,true);const c=Math.cos(Math.PI/4),s=Math.sin(Math.PI/4);
      out.push(`q ${c.toFixed(4)} ${s.toFixed(4)} ${(-s).toFixed(4)} ${c.toFixed(4)} ${x} ${H-y} cm BT /F2 ${size} Tf ${col(color)} rg ${(-w/2).toFixed(1)} 0 Td (${pdfEsc(t)}) Tj ET Q`)},
    wrap(x,y,t,width,o={}){const size=o.size||10,words=pdfSafe(t).split(/\s+/);let line='',yy=y;words.forEach(w=>{const tr=line?line+' '+w:w;if(pdfW(tr,size,o.bold)>width&&line){api.text(x,yy,line,o);yy+=size+4;line=w}else line=tr});if(line){api.text(x,yy,line,o);yy+=size+4}return yy}
  };
  draw(api);
  const content=out.join('\n');
  const objs=[
    '<< /Type /Catalog /Pages 2 0 R >>',
    '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> /Contents 4 0 R >>',
    `<< /Length ${content.length} >>\nstream\n${content}\nendstream`,
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>',
    `<< /Title (${pdfEsc(meta.title)}) /Author (${pdfEsc(meta.author)}) /Producer (Vidyapeeth ERP) /CreationDate (D:${meta.date}) >>`
  ];
  let pdf='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';const offs=[];
  objs.forEach((o,i)=>{offs.push(pdf.length);pdf+=`${i+1} 0 obj\n${o}\nendobj\n`});
  const xref=pdf.length;
  pdf+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R /Info 7 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
  return pdf;
}

function receiptMailText(p){const d=receiptData(p),s=d.s;return`Dear ${s.guardian.name||'Parent'},\n\n${d.cancelled?'This receipt has been cancelled.':'We have received your fee payment.'} Receipt ${p.rc} is attached as a PDF.\n\nStudent: ${s.name} (${s.id})\nClass: ${d.cls}\nDate: ${fmtD(p.date)}\nPaid by: ${p.mode}${p.ref?' · '+p.ref:''}\nAmount: ${inr(p.amount)}\nFee balance now: ${inr(p.balAfter)}\n\n${d.college}`}
function buildReceiptMail(p){
  const pdf=receiptPdf(p),d=receiptData(p);
  return{subject:`Fee receipt ${p.rc} - ${d.college}`,fragment:receiptMailFragment(p),text:receiptMailText(p),pdf,filename:p.rc+'.pdf',
    html:`<!doctype html><html><body style="margin:0;padding:20px;background:#f3f5fa">${receiptMailFragment(p)}</body></html>`};
}

/* ---------- who gets it ---------- */
function mailTargets(s){
  const m=mailCfg(),a=[],seen=new Set();
  const add=(name,email,role)=>{email=String(email||'').trim();if(!MAIL_RE.test(email)||seen.has(email.toLowerCase()))return;seen.add(email.toLowerCase());a.push({name,email,role})};
  if(m.to!=='student')add(s.guardian.name,s.guardian.email,'Parent');
  if(m.to!=='guardian')add(s.name,s.email,'Student');
  return a;
}
const shortList=a=>a.length>2?a.slice(0,2).join(', ')+' +'+(a.length-2):a.join(', ');

/* ---------- queue and send ---------- */
function queueReceiptMail(p,o={}){
  const m=mailCfg(),s=stu(p.studentId);
  if(o.trigger==='auto'&&!m.enabled)return null;
  const to=o.to||mailTargets(s);
  const rec={id:uid('o'),ts:Date.now(),paymentId:p.id,rc:p.rc,studentId:s.id,to:to.map(x=>x.email),names:to.map(x=>x.role),subject:`Fee receipt ${p.rc} - ${db.settings.college}`,filename:p.rc+'.pdf',bytes:0,
    status:'Queued',mode:m.mode,attempts:0,error:'',trigger:o.trigger||'auto'};
  db.outbox.unshift(rec);if(db.outbox.length>300)db.outbox.length=300;
  if(!to.length){rec.status='Skipped';rec.error='No valid email address on file for this student or guardian';ev('Email','Receipt email skipped',`${p.rc}: ${rec.error}`,{status:'fail'});return rec}
  ev('Email','Receipt email queued',`${p.rc} to ${to.map(x=>x.email).join(', ')}`);
  setTimeout(()=>deliver(rec.id),MAIL_DELAY);
  return rec;
}
async function deliver(id){
  const rec=db.outbox.find(x=>x.id===id);if(!rec||/^Sent/.test(rec.status))return;
  const p=db.payments.find(x=>x.id===rec.paymentId),m=mailCfg();
  rec.status='Sending';rec.attempts++;rec.mode=m.mode;refreshMailUi(rec);
  try{
    if(!p)throw new Error('Receipt not found');
    const mail=buildReceiptMail(p);rec.bytes=mail.pdf.length;
    if(m.mode==='live'){
      const redirect=m.redirect&&rec.trigger!=='test'?m.redirect.trim():'';
      const to=redirect?[redirect]:rec.to;
      const subject=redirect?`[TEST for ${shortList(rec.to)}] ${mail.subject}`:mail.subject;
      let r,j={};
      try{r=await fetch(m.endpoint||'/api/send-receipt',{method:'POST',headers:{'content-type':'application/json','x-api-key':m.key||''},body:JSON.stringify({to,subject,html:mail.html,text:mail.text,filename:mail.filename,pdfBase64:btoa(mail.pdf),fromName:m.fromName||db.settings.college,replyTo:m.replyTo||''})})}
      catch(e){throw new Error('Could not reach the mail server. Check the address in Settings, and that the site is deployed with the mail function.')}
      try{j=await r.json()}catch(e){}
      if(!r.ok||!j.ok)throw new Error(j.error||`Mail server answered ${r.status}`);
      rec.providerId=j.id||'';rec.status='Sent';rec.sentTo=to;
    }else{await sleep(250);rec.status='Sent (demo)'}
    rec.error='';rec.sentAt=Date.now();
  }catch(e){rec.status='Failed';rec.error=e.message||'Could not send'}
  ev('Email',rec.status==='Failed'?'Receipt email failed':'Receipt email sent',`${rec.rc} to ${(rec.sentTo||rec.to).join(', ')}${rec.status==='Failed'?': '+rec.error:rec.mode==='live'?' (live)':' (demo)'}`,{user:null,name:'Mail system',status:rec.status==='Failed'?'fail':'ok'});
  if(rec.status==='Failed')notify('mailfail',`Receipt email failed · ${rec.rc}`,rec.error||'Could not send',{key:'mf:'+rec.id,tone:'bad',go:{staff:['fees','outbox']},self:true});
  save();refreshMailUi(rec);
}
function mailPill(st){return pill(st,/^Sent/.test(st)?'good':st==='Failed'?'bad':st==='Skipped'?'warn':'')}
function lastMail(p){return db.outbox.find(o=>o.paymentId===p.id&&o.trigger!=='test')}
function mailLineHtml(p){
  const o=lastMail(p);const s=stu(p.studentId);const t=mailTargets(s);
  if(!o)return t.length?`<span class="muted">Not e-mailed yet. Will go to ${E(shortList(t.map(x=>x.email)))}</span>`:`<span class="muted">No email address on file</span>`;
  const when=o.sentAt?' · '+E(fmtT(o.sentAt)):'';
  return`${mailPill(o.status)} <span class="muted">${o.status==='Skipped'||o.status==='Failed'?E(o.error):'PDF to '+E(shortList(o.to))+when}</span>`;
}
const mailLine=p=>`<div class="maillive" data-mailpay="${E(p.id)}" style="margin-top:10px;font-size:13px">${mailLineHtml(p)}</div>`;
function refreshMailUi(rec){
  $$('.maillive').forEach(el=>{const p=db.payments.find(x=>x.id===el.dataset.mailpay);if(p)el.innerHTML=mailLineHtml(p)});
  const busy=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'')||$('#layer').innerHTML||$('#dlg').innerHTML;
  if(!busy&&ui.route==='fees'&&ui.tab.fees==='outbox'&&$('#page'))renderPage();
  const mp=$('#mailPrevStatus');if(mp&&mp.dataset.id===rec.id)mp.innerHTML=mailPill(rec.status)+(rec.error?` <span class="muted">${E(rec.error)}</span>`:'');
}

/* ---------- actions ---------- */
function mayMailReceipt(p){const u=cur();if(!u)return false;if(u.role==='Parent'||u.role==='Student')return p.studentId===u.studentId;return can('fees.view')}
ACT.emailReceipt=el=>{
  const p=db.payments.find(x=>x.id===el.dataset.id);if(!p||!mayMailReceipt(p))throw new Error('Receipt not found');
  const rec=queueReceiptMail(p,{trigger:'manual'});save();
  if(rec&&rec.status==='Skipped')toast('No email address on file. Add one first.',true);else toast('Receipt PDF is being emailed to '+shortList(rec.to));
  refreshMailUi(rec);
};
ACT.mailRetry=el=>{
  const o=db.outbox.find(x=>x.id===el.dataset.id);if(!o||!can('fees.view'))throw new Error('Not allowed');
  const p=db.payments.find(x=>x.id===o.paymentId);
  if(o.status==='Failed'){o.status='Queued';o.error='';save();deliver(o.id);toast('Trying again')}
  else{const rec=queueReceiptMail(p,{trigger:'resend'});save();toast(rec.status==='Skipped'?'No email address on file':'Receipt is being sent again');refreshMailUi(rec);if(ui.route==='fees')renderPage()}
};
ACT.mailRetryAll=()=>{const f=db.outbox.filter(o=>o.status==='Failed');f.forEach(o=>{o.status='Queued';o.error='';deliver(o.id)});save();toast(f.length?`Retrying ${f.length} email${f.length>1?'s':''}`:'Nothing to retry');renderPage()};
ACT.dlPdf=el=>{const p=db.payments.find(x=>x.id===el.dataset.id);if(!p||!mayMailReceipt(p))throw new Error('Receipt not found');savePdf(p).catch(()=>toast('Could not save the PDF',true))};
async function savePdf(p){
  const bytes=pdfBytes(receiptPdf(p)),name=p.rc+'.pdf';
  /* inside the Claude viewer, ask its save prompt; on a normal website, download directly */
  let dl=null;try{if(window.claude&&claude.use)dl=await claude.use('downloads')}catch(e){}
  if(dl){try{await dl.save({filename:name,data:bytes});toast('PDF saved');return}catch(e){if(e&&e.code==='declined')return;if(!e||e.code!=='unavailable'){toast('Could not save the PDF here',true);return}}}
  const blob=new Blob([bytes],{type:'application/pdf'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('PDF downloaded');
}
ACT.mailPreview=el=>{
  const o=db.outbox.find(x=>x.id===el.dataset.id);if(!o)throw new Error('Email not found');const p=db.payments.find(x=>x.id===o.paymentId);const m=mailCfg();
  const mail=buildReceiptMail(p);
  drawer(`<button class="btn x" data-act="close">Close</button><h2>Email preview</h2>
   <div class="panel" style="padding:12px;margin:12px 0"><div class="rline"><span>From</span><span>${E(m.fromName||db.settings.college)}</span></div><div class="rline"><span>To</span><span style="text-align:right">${E(o.to.join(', ')||'-')}</span></div><div class="rline"><span>Subject</span><span style="text-align:right">${E(o.subject)}</span></div>
   <div class="rline"><span>Status</span><span id="mailPrevStatus" data-id="${o.id}">${mailPill(o.status)}${o.error?` <span class="muted">${E(o.error)}</span>`:''}</span></div>
   <div class="rline"><span>Attachment</span><span>${pill('PDF')} ${E(o.filename)} · ${fmtSize(mail.pdf.length)}</span></div></div>
   <div class="mailbody">${mail.fragment}</div>
   <div class="actions" style="margin-top:14px"><button class="btn primary" data-act="mailRetry" data-id="${o.id}">${o.status==='Failed'?'Retry sending':'Send again'}</button><button class="btn" data-act="dlPdf" data-id="${p.id}">Download PDF</button><button class="btn" data-act="viewReceipt" data-id="${p.id}">Open receipt</button></div>
   <p class="note">${m.mode==='live'?'Live mode: this goes through your mail server.':'Demo mode: nothing is actually sent. Switch to live mode in Settings once the mail server is set up.'}</p>`);
};

FORM.saveMail=(f,d)=>{
  if(!can('settings.manage'))throw new Error('You do not have access to settings');
  if(d.redirect&&!MAIL_RE.test(d.redirect.trim()))throw new Error('Test redirect is not a valid email address');
  if(d.replyTo&&!MAIL_RE.test(d.replyTo.trim()))throw new Error('Reply-to is not a valid email address');
  if(d.mode==='live'&&!String(d.endpoint||'').trim())throw new Error('Enter the mail server address (usually /api/send-receipt)');
  Object.assign(db.settings.mail,{enabled:d.enabled==='1',to:d.to,mode:d.mode,endpoint:d.endpoint.trim()||'/api/send-receipt',key:d.key,fromName:d.fromName.trim(),replyTo:d.replyTo.trim(),redirect:d.redirect.trim()});
  log('Settings changed','Email receipts: '+(db.settings.mail.enabled?'on':'off')+', '+db.settings.mail.mode);save();toast('Email settings saved');renderPage();
};
ACT.mailPing=async()=>{
  const m=mailCfg(),out=$('#mailPingOut');out.textContent='Checking...';
  try{const r=await fetch(m.endpoint||'/api/send-receipt');const j=await r.json();
    out.textContent=j.configured?`Mail server is reachable and ready (sending as ${j.from||'configured address'}).`:'Mail server is reachable but not set up: add RESEND_API_KEY, MAIL_FROM and RECEIPT_API_KEY in Vercel, then redeploy.'}
  catch(e){out.textContent='Could not reach the mail server at '+(m.endpoint||'/api/send-receipt')+'. This is expected in the preview: the server exists only on the deployed site.'}
};
ACT.mailTestAsk=()=>{
  if(!db.payments.some(p=>p.status==='ok'))throw new Error('Make a payment first. The test uses the latest receipt.');
  dialog(`<h3>Send a test email</h3><form data-form="mailTest" class="grid" style="gap:12px"><p class="muted" style="margin:0">Sends the latest receipt with its PDF to this address.</p>${F('email','Send to',{type:'email',req:1,ph:'your@email.com'})}<div class="actions" style="justify-content:flex-end"><button type="button" class="btn" data-act="closeDialog">Cancel</button><button class="btn primary">Send test</button></div></form>`);
};
FORM.mailTest=(f,d)=>{
  if(!can('settings.manage'))throw new Error('You do not have access to settings');
  const email=d.email.trim();if(!MAIL_RE.test(email))throw new Error('Enter a valid email address');
  const p=db.payments.filter(x=>x.status==='ok').sort((a,b)=>b.ts-a.ts)[0];
  const rec=queueReceiptMail(p,{trigger:'test',to:[{email,role:'Test'}]});save();closeDialog();toast('Test email is being sent to '+email);setTimeout(()=>{if(ui.route==='settings')toast(mailCfg().mode==='live'?'Check your inbox and the Email outbox':'Demo mode: see the Email outbox')},MAIL_DELAY+600);
};

/* ----- attendance ----- */
function viewAttendance(){
  const tabs=(can('attendance.mark')?[['mark','Mark attendance']]:[]).concat([['register','Register'],['low','Below 75%']]);let t=ui.tab.attendance;if(!tabs.find(x=>x[0]===t))t=ui.tab.attendance=tabs[0][0];
  const divs=myDivisions();const f=ui.f.att=ui.f.att||{};if(!divs.find(d=>d.id===f.div))f.div=divs[0]?.id;
  const sel=`<div class="filters"><select aria-label="Division" data-change="attDiv">${divs.map(d=>`<option value="${d.id}" ${f.div===d.id?'selected':''}>${E(divName(d))}</option>`).join('')}</select></div>`;
  return head('Attendance',can('attendance.mark')?'Mark each division once a day. Everyone is present by default, so only tap the absent students.':'Attendance by division')+tabsBar('attendance',tabs,t)+(t==='low'?attLow(divs):sel+(t==='mark'?attMark(f):attRegister(f)));
}
CHG.attDiv=el=>{ui.f.att.div=el.value;renderPage()};
function attMark(f){
  if(!f.div)return'<div class="panel empty">You have no divisions assigned.</div>';
  const d=divOf(f.div);const date=f.date||today();const rec=db.attendance[date]?.[d.id];const studs=db.students.filter(s=>s.div===d.id&&s.status==='Active');
  return`<div class="panel"><form data-form="markAtt" data-d="${d.id}"><div class="filters"><div class="field"><label class="label" for="ad">Date</label><input type="date" id="ad" name="date" value="${date}" max="${today()}" data-change="attDate"></div>${rec?pill('Already marked · editing','acc'):pill('Not marked yet','warn')}<span style="flex:1"></span><button type="button" class="btn sm" data-act="allPresent">Mark all present</button></div>
   <div class="tablewrap"><table><thead><tr><th>Student</th><th>Present</th><th>Absent</th><th>This sem</th></tr></thead><tbody>${studs.map(s=>{const v=rec?.marks[s.id]||'P';const a=attPct(s);return`<tr><td>${E(s.name)} <span class="mono muted">${E(s.id)}</span></td><td><input type="radio" name="a_${E(s.id)}" value="P" ${v==='P'?'checked':''} aria-label="${E(s.name)} present"></td><td><input type="radio" name="a_${E(s.id)}" value="A" ${v==='A'?'checked':''} aria-label="${E(s.name)} absent"></td><td>${a===null?'—':pill(a+'%',a<75?'bad':'good')}</td></tr>`}).join('')}</tbody></table></div>
   <div class="actions" style="margin-top:12px"><button class="btn primary">Save attendance</button></div></form></div>`;
}
CHG.attDate=el=>{ui.f.att.date=el.value;renderPage()};
ACT.allPresent=()=>$$('input[type=radio][value=P]').forEach(r=>r.checked=true);
FORM.markAtt=(f,d)=>{
  if(!can('attendance.mark'))throw new Error('You do not have access to mark attendance');const dv=divOf(f.dataset.d);if(!myDivisions().find(x=>x.id===dv.id))throw new Error('This is not one of your divisions');
  const date=d.date||today();if(date>today())throw new Error('Cannot mark a future date');if(parseD(date).getDay()===0)throw new Error('Sunday is a holiday');
  const marks={};db.students.filter(s=>s.div===dv.id&&s.status==='Active').forEach(s=>marks[s.id]=d['a_'+s.id]==='A'?'A':'P');
  db.attendance[date]=db.attendance[date]||{};db.attendance[date][dv.id]={sem:semOfDiv(dv),marks};const ab=Object.values(marks).filter(v=>v==='A').length;
  log('Attendance marked',`${divName(dv)} on ${fmtD(date)}: ${ab} absent`);
  if(date===today())Object.keys(marks).forEach(id=>{if(marks[id]!=='A')return;const s=stu(id);notify('attendance',`${s.name} was absent today`,`Marked absent on ${fmtD(date)} in ${divName(dv)}. If this is a mistake, contact the class teacher.`,{sid:id,key:`abs:${id}:${date}`,tone:'warn',go:{portal:{Parent:'phome',Student:'shome'}},roles:['Parent','Student'].filter(r=>ntOn('attendance',r))})});save();toast(`Saved. ${ab} absent, ${Object.keys(marks).length-ab} present`);renderPage();
};
function attRegister(f){
  if(!f.div)return'';const d=divOf(f.div);const studs=db.students.filter(s=>s.div===d.id&&s.status==='Active');const dates=Object.keys(db.attendance).filter(x=>db.attendance[x][d.id]).sort().slice(-14);
  return`<div class="panel"><div class="tablewrap"><table><thead><tr><th>Student</th>${dates.map(x=>`<th title="${fmtD(x)}" style="text-align:center">${parseD(x).getDate()}</th>`).join('')}<th class="num">Present</th><th class="num">%</th></tr></thead><tbody>${studs.map(s=>{let p=0,t=0;Object.values(db.attendance).forEach(day=>{const r=day[d.id];if(r&&r.sem===s.sem&&r.marks[s.id]){t++;if(r.marks[s.id]==='P')p++}});const pc=t?Math.round(p/t*100):null;
   return`<tr><td>${E(s.name)}</td>${dates.map(x=>{const v=db.attendance[x][d.id].marks[s.id];return`<td style="text-align:center"><span class="dot" style="background:${v==='P'?'var(--good)':v==='A'?'var(--bad)':'var(--line)'}" title="${v||'-'}"></span></td>`}).join('')}<td class="num">${p} / ${t}</td><td class="num">${pc===null?'—':pill(pc+'%',pc<75?'bad':'good')}</td></tr>`}).join('')}</tbody></table></div><p class="note">Dates shown are days of the month for the last 14 marked days. Green is present and red is absent.</p></div>`;
}
function attLow(divs){
  const l=db.students.filter(s=>s.status==='Active'&&divs.some(d=>d.id===s.div)).map(s=>({s,a:attPct(s)})).filter(x=>x.a!==null&&x.a<75).sort((x,y)=>x.a-y.a);
  return`<div class="panel"><div class="tablewrap"><table><thead><tr><th>Student</th><th>Division</th><th>Attendance</th><th>Guardian</th><th></th></tr></thead><tbody>${l.map(x=>`<tr><td>${E(x.s.name)}</td><td>${E(divName(divOf(x.s.div)))}</td><td>${pill(x.a+'%','bad')}</td><td>${E(x.s.guardian.name)} · ${E(x.s.guardian.phone)}</td><td>${can('messages.send')?`<button class="btn sm" data-act="notifyAtt" data-id="${E(x.s.id)}">Notify guardian</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No student is below 75%.</td></tr>'}</tbody></table></div></div>`;
}
ACT.notifyAtt=el=>{const s=stu(el.dataset.id);sendMsg('custom',s,'WhatsApp',`Dear ${s.guardian.name}, ${s.name}'s attendance is ${attPct(s)}%, below the required 75%. Please ensure regular attendance. - ${db.settings.short}`);log('Attendance alert',s.name);notify('attendance','Attendance below 75%',`${s.name}'s attendance is ${attPct(s)}%. Please ensure regular attendance.`,{sid:s.id,tone:'warn',go:{portal:{Parent:'phome',Student:'shome'}},roles:['Parent','Student'].filter(r=>ntOn('attendance',r))});save();toast('Guardian notified (demo)')};

/* ----- internal marks ----- */
const EXAMS=['Internal 1','Internal 2','Assignment','Practical'];
function viewMarks(){
  const divs=myDivisions();const f=ui.f.marks=ui.f.marks||{exam:'Internal 1'};if(!divs.find(d=>d.id===f.div)){const me=cur().staffId;f.div=(divs.find(d=>db.subjects.some(s=>s.faculty===me&&s.course===d.course&&s.sem===semOfDiv(d)))||divs[0])?.id;f.sub=null}
  if(!f.div)return head('Internal Marks')+'<div class="panel empty">You have no divisions assigned.</div>';
  const d=divOf(f.div);const sem=semOfDiv(d);const subs=db.subjects.filter(s=>s.course===d.course&&s.sem===sem);if(!subs.find(s=>s.id===f.sub))f.sub=(subs.find(s=>s.faculty===cur().staffId)||subs[0])?.id;
  const sb=subs.find(s=>s.id===f.sub);const rec=db.marks.find(m=>m.divId===d.id&&m.subjectId===f.sub&&m.exam===f.exam);const studs=db.students.filter(s=>s.div===d.id&&s.status==='Active');
  const mine=cur().role==='Super Admin'||(sb&&sb.faculty===cur().staffId);const editable=can('marks.enter')&&mine;
  return head('Internal Marks','Enter marks for your subjects. Principal and admin can view all.',`<button class="btn" data-act="exportMarks">Copy marks sheet as CSV</button>`)+
  `<div class="panel"><div class="filters"><select aria-label="Division" data-change="marksF" data-k="div">${divs.map(x=>`<option value="${x.id}" ${f.div===x.id?'selected':''}>${E(divName(x))}</option>`).join('')}</select>
   <select aria-label="Subject" data-change="marksF" data-k="sub">${subs.map(x=>`<option value="${x.id}" ${f.sub===x.id?'selected':''}>${E(x.name)}</option>`).join('')}</select>
   <select aria-label="Exam" data-change="marksF" data-k="exam">${EXAMS.map(x=>`<option ${f.exam===x?'selected':''}>${x}</option>`).join('')}</select>${sb?pill('Faculty: '+(staffOf(sb.faculty)?.name||'-'),mine?'acc':''):''}</div>
   ${sb?`<form data-form="saveMarks"><div class="field" style="max-width:160px;margin-bottom:10px"><label class="label" for="mx">Maximum marks</label><input type="number" id="mx" name="max" min="1" value="${rec?.max||20}" ${editable?'':'disabled'}></div>
   <div class="tablewrap"><table><thead><tr><th>Student</th><th>Marks</th><th>%</th></tr></thead><tbody>${studs.map(s=>{const v=rec?.scores[s.id]??'';return`<tr><td>${E(s.name)} <span class="mono muted">${E(s.id)}</span></td><td><input type="number" name="s_${E(s.id)}" value="${E(v)}" min="0" step="0.5" style="width:90px" ${editable?'':'disabled'} aria-label="Marks for ${E(s.name)}"></td><td>${v===''?'—':Math.round(v/(rec?.max||20)*100)+'%'}</td></tr>`}).join('')}</tbody></table></div>
   ${editable?'<div class="actions" style="margin-top:12px"><button class="btn primary">Save marks</button></div>':`<p class="note">${can('marks.enter')?'You can enter marks only for your own subjects.':'View only.'}</p>`}</form>`:'<p class="empty">No subjects for this semester.</p>'}</div>`;
}
CHG.marksF=el=>{ui.f.marks[el.dataset.k]=el.value;renderPage()};
FORM.saveMarks=(f,d)=>{
  const m=ui.f.marks;const dv=divOf(m.div);const sb=db.subjects.find(x=>x.id===m.sub);if(!can('marks.enter')||!(cur().role==='Super Admin'||sb.faculty===cur().staffId))throw new Error('You can enter marks only for your own subjects');
  const max=+d.max;if(!(max>0))throw new Error('Enter the maximum marks');const scores={};let bad=null;db.students.filter(s=>s.div===dv.id&&s.status==='Active').forEach(s=>{const v=d['s_'+s.id];if(v!==''&&v!==undefined){if(+v>max)bad=s.name;scores[s.id]=String(v)}});
  if(bad)throw new Error(`Marks for ${bad} are above the maximum of ${max}`);
  let rec=db.marks.find(x=>x.divId===dv.id&&x.subjectId===sb.id&&x.exam===m.exam);if(!rec){rec={id:uid('m'),divId:dv.id,subjectId:sb.id,sem:semOfDiv(dv),exam:m.exam,max,scores,by:sb.faculty};db.marks.push(rec)}else{rec.max=max;rec.scores=scores}
  log('Marks saved',`${sb.name}, ${m.exam}, ${divName(dv)}`);Object.keys(scores).forEach(id=>notify('marks',`Marks published · ${sb.name}`,`${m.exam}: ${scores[id]} out of ${max}.`,{sid:id,key:`mk:${rec.id}:${id}:${scores[id]}`,tone:'info',go:{portal:{Parent:'phome',Student:'sacademic'}},roles:['Parent','Student'].filter(r=>ntOn('marks',r))}));save();toast('Marks saved');renderPage();
};
ACT.exportMarks=()=>{const m=ui.f.marks;const d=divOf(m.div);const sem=semOfDiv(d);const subs=db.subjects.filter(s=>s.course===d.course&&s.sem===sem);const studs=db.students.filter(s=>s.div===d.id&&s.status==='Active');
  showCsv(`Marks sheet · ${m.exam}`,['Enrolment','Student',...subs.map(s=>s.name)],studs.map(s=>[s.id,s.name,...subs.map(sb=>{const r=db.marks.find(x=>x.divId===d.id&&x.subjectId===sb.id&&x.exam===m.exam);return r&&r.scores[s.id]!==undefined?r.scores[s.id]+'/'+r.max:''})]))};

const SYS_ROLES=['None',...ROLE_NAMES];
function viewStaff(){
  const t=ui.tab.staff||'staff';
  const acts=can('staff.manage')?'<button class="btn primary" data-act="addStaff">+ Add staff</button>':'';
  const body=t==='roles'?staffRoles():`<div class="panel" style="padding:6px 8px"><div class="tablewrap"><table><thead><tr><th>Name</th><th>Designation</th><th>Department</th><th>System role</th><th>Login</th><th>Status</th><th></th></tr></thead><tbody>
   ${db.staff.map(s=>{const u=db.users.find(x=>x.id===s.userId);return`<tr><td><div class="who"><div class="av">${E(initials(s.name))}</div><div>${E(s.name)}<br><small class="muted">${E(s.qualification)}</small></div></div></td><td>${E(s.designation)}</td><td>${E(s.department)}</td><td>${s.role==='None'?pill('No login'):pill(s.role,'acc')}</td>
   <td>${u?`<span class="mono">${E(u.username)}</span> ${u.active?pill('On','good'):pill('Off','bad')}`:s.role!=='None'?pill('Login not created','warn'):'—'}</td><td>${pill(s.status,s.status==='Active'?'good':s.status==='On leave'?'warn':'bad')}</td><td>${can('staff.manage')?`<button class="btn sm" data-act="editStaff" data-id="${s.id}">Edit</button>`:''}</td></tr>`}).join('')}</tbody></table></div></div>`;
  return head('Staff and Roles','Every person gets their own login. The role decides which menus and actions they get.',acts)+tabsBar('staff',[['staff','Staff and logins'],['roles','Role permissions']],t)+body;

  ${F('status','Status',{opts:['Active','On leave','Left'],val:s?.status||'Active'})}${F('role','System role',{opts:SYS_ROLES,val:s?.role||'None'})}${(()=>{const u=s&&db.users.find(x=>x.id===s.userId);return F('username','Login username',{val:u?.username||'',ph:'Needed when a role is chosen'})+F('password','Password',{val:'',ph:u?'Leave blank to keep':'Min 6 characters'})})()}

FORM.saveStaff=(f,d)=>{
  if(!can('staff.manage'))throw new Error('You do not have access to manage staff');
  let s=f.dataset.id?staffOf(f.dataset.id):null;const isNew=!s;let u=s&&db.users.find(x=>x.id===s.userId);const was=u?{role:u.role,active:u.active,un:u.username}:null;
  if(d.role!=='None'){const un=(d.username||'').trim().toLowerCase();if(!un)throw new Error('Enter a login username for this role');
    if(db.users.some(x=>x.username.toLowerCase()===un&&x.id!==u?.id))throw new Error('This username is already taken');
    if(!u&&(d.password||'').length<6)throw new Error('Password must be at least 6 characters');if(d.password&&d.password.length<6)throw new Error('Password must be at least 6 characters')}
  if(isNew){s={id:uid('st'),userId:null};db.staff.push(s)}
  Object.assign(s,{name:d.name.trim(),designation:d.designation,department:d.department,qualification:d.qualification,phone:d.phone,email:d.email,joined:d.joined,status:d.status,role:d.role});
  if(d.role==='None'){if(u)u.active=false}
  else{if(!u){u={id:uid('u'),username:'',password:'',role:d.role,staffId:s.id,active:true};db.users.push(u);s.userId=u.id}
    u.username=d.username.trim();u.name=s.name;u.role=d.role;if(d.password)u.password=d.password;u.active=d.status!=='Left'}
  if(u&&u.id===sesGet()&&!u.active)sesDel();
  log(isNew?'Staff added':'Staff edited',`${s.name} (${d.role})`);
  if(u&&d.role!=='None'){const ch=[];if(isNew||!was)ch.push('created');else{if(was.role!==u.role)ch.push('role changed to '+u.role);if(d.password)ch.push('password reset by the administrator');if(was.un!==u.username)ch.push('username changed');if(!was.active&&u.active)ch.push('switched on')}
    if(ch.length){const by=(cur()||{name:'the administrator'}).name,made=ch[0]==='created';notify('account',`Your login was ${made?'created':'updated'}`,`${ch.join(', ')}. Username: ${u.username}.`,{uids:[u.id],roles:[],tone:'info'});notify('account',`Login ${made?'created':'updated'} · ${s.name}`,`${ch.join(', ')} (by ${by}).`,{tone:'info',go:{staff:['staff']}})}}save();closeLayer();toast(isNew?'Staff added. They can sign in now.':'Saved');if(!cur()){renderLogin();return}renderApp();
};

function viewMessages(){

  return head('Messages and Notices','Send fee reminders and notices. In this demo, messages are written to the log instead of going out on WhatsApp or SMS.')+tabsBar('messages',tabs,t)+body;

function msgRemind(){
  const f=ui.f.remind=ui.f.remind||{only:'1',kind:'reminder',channel:'WhatsApp'};

  return`<div class="grid two"><div class="panel"><h2>Students with dues</h2><form data-form="sendRemind"><div class="filters"><select aria-label="Who" data-change="remindF" data-k="only"><option value="1" ${f.only?'selected':''}>Overdue only</option><option value="" ${f.only?'':'selected'}>All with dues</option></select></div>

   <div class="form" style="margin-top:12px">${F('kind','Message',{opts:[['reminder','Fee reminder'],['overdue','Overdue notice']],val:f.kind,attrs:'data-change="remindF" data-k="kind"'})}${F('channel','Send by',{opts:['WhatsApp','SMS'],val:f.channel,attrs:'data-change="remindF" data-k="channel"'})}<button class="btn gold span" ${l.length?'':'disabled'}>Send to selected</button></div></form></div>

FORM.sendRemind=(form,d)=>{if(!can('messages.send'))throw new Error('You do not have access to send messages');const ids=$$('input[name=ids]:checked',form).map(i=>i.value);if(!ids.length)throw new Error('Select at least one student');

  db.users.filter(u=>u.role!=='Parent'&&u.role!=='Student'&&!S[u.id]).forEach(u=>S[u.id]={id:u.id,n:u.name,r:u.role,un:u.username,last:0,signins:0,count:0,fail:0,page:''});
  const list=Object.values(S).sort((a,b)=>b.last-a.last);
  return`<div class="panel" style="padding:6px 8px"><div class="tablewrap"><table><thead><tr><th>Person</th><th>Role</th><th>Last active</th><th class="num">Sign-ins</th><th class="num">Events</th><th class="num">Failed</th><th>Last page</th></tr></thead><tbody>

}

const BELL_SVG='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';
function bellHtml(){const n=ntUnread(cur());return`<button class="iconbtn bell" id="bell" data-act="bell" type="button" aria-label="${n?`Notifications, ${n} unread`:'Notifications'}" title="Notifications">${BELL_SVG}<span class="bdg" id="bellN" ${n?'':'hidden'}>${n>99?'99+':n}</span></button>`}
let ntKnown=null;
function updateBell(){
  const u=cur();ntKnown=new Set(ntMine(u).map(n=>n.id));
  const b=$('#bell'),g=$('#bellN');if(!b||!g||!u)return;const n=ntUnread(u);
  g.textContent=n>99?'99+':String(n);g.hidden=!n;b.setAttribute('aria-label',n?`Notifications, ${n} unread`:'Notifications');
}
const NT_TONE_LABEL={good:'Good news',warn:'Needs attention',bad:'Problem',info:''};
function ntItem(n){
  const c=ntCat(n.k)||{l:'Notification'};
  return`<button type="button" class="nt ${n.read?'':'unread'} ${n.tone||'info'}" data-act="ntOpen" data-id="${E(n.id)}"><span class="ntdot" aria-hidden="true"></span><span class="ntb"><b>${E(n.t)}</b>${n.x?`<span class="ntx">${E(n.x)}</span>`:''}<small>${E(c.l)} · ${E(ago(n.ts))}${n.read?'':' · <em>New</em>'}</small></span></button>`;
}
function ntHtml(){
  const u=cur();const st=ui.nt=ui.nt||{f:'all',cat:'',n:25};const all=ntMine(u);const un=all.filter(n=>!n.read).length;
  const list=all.filter(n=>(st.f==='all'||!n.read)&&(!st.cat||n.k===st.cat));const shown=list.slice(0,st.n);
  const cats=[...new Set(all.map(n=>n.k))].map(k=>[k,(ntCat(k)||{l:k}).l]);
  return`<button class="btn x" data-act="close">Close</button><h2>Notifications</h2>
   <p class="muted" style="margin:2px 0 12px">${un?`${un} unread`:'You are all caught up'}${all.length?` · ${all.length} in total`:''}</p>
   <div class="tabs" role="tablist" style="margin-bottom:10px"><button role="tab" aria-selected="${st.f==='all'}" data-act="ntF" data-f="all">All</button><button role="tab" aria-selected="${st.f==='unread'}" data-act="ntF" data-f="unread">Unread${un?` (${un})`:''}</button></div>
   <div class="actions" style="margin-bottom:12px;align-items:center">${cats.length>1?`<select aria-label="Type of notification" data-change="ntCat" style="flex:1;min-width:0"><option value="">All types</option>${cats.map(([k,l])=>`<option value="${E(k)}" ${st.cat===k?'selected':''}>${E(l)}</option>`).join('')}</select>`:''}<button class="btn" data-act="ntReadAll" ${un?'':'disabled'}>Mark all as read</button></div>
   <div class="ntlist">${shown.length?shown.map(ntItem).join(''):`<p class="note">${all.length?'Nothing matches this filter.':'No notifications yet. Payments, notices, dues and approvals for your role will show up here.'}</p>`}</div>
   ${list.length>shown.length?`<div class="actions" style="justify-content:center;margin-top:12px"><button class="btn" data-act="ntMore">Show ${Math.min(25,list.length-shown.length)} older</button></div>`:''}`;
}
const ntRedraw=()=>{const d=$('.drawer');if(!d||!/^Notifications/.test(d.querySelector('h2')?.textContent||''))return;const sc=d.scrollTop;d.innerHTML=ntHtml();d.scrollTop=sc};
ACT.bell=()=>{ui.nt={f:'all',cat:'',n:25};drawer(ntHtml());updateBell()};
ACT.ntF=el=>{ui.nt.f=el.dataset.f;ui.nt.n=25;ntRedraw()};
CHG.ntCat=el=>{ui.nt.cat=el.value;ui.nt.n=25;ntRedraw()};

/* a change made in another tab: update the bell and say so */
window.addEventListener('storage',e=>{
  if(e.key!==LS_KEY||!e.newValue)return;const u=cur();if(!u)return;
  let n;try{n=JSON.parse(e.newValue)}catch(x){return}if(!n||!Array.isArray(n.notifs))return;
  if(!ntKnown)ntKnown=new Set(ntMine(u).map(x=>x.id));

  setTimeout(()=>{updateBell();if($('.drawer')&&/Notifications/.test($('.drawer h2')?.textContent||''))ntRedraw();if(fresh.length)toast(fresh.length===1?'New notification: '+fresh[0].t:fresh.length+' new notifications')},40);

   <p class="note" style="margin:0 0 12px">Choose who is notified about each event. Everyone sees theirs under the bell at the top. The person who does something is never notified about their own action, and the people directly concerned (the one who asked for a concession, the owner of a login) are always told.</p>

};
ACT.ntRulesReset=()=>{
  if(!cur()||cur().role!=='Super Admin')throw new Error('Only the Super Admin can change notification rules');

window.addEventListener('storage',e=>{
  if(e.key!==LS_KEY||!e.newValue)return;
  let n;try{n=JSON.parse(e.newValue)}catch(x){return}if(!n||n.ver!==3)return;
  db=n;if(!cur()){if(!$('form[data-form=login]'))renderLogin();return}
  if(!$('#page'))return;
  const busy=$('#layer').innerHTML||$('#dlg').innerHTML||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'');
  if(!busy){renderPage();toast('Updated from another tab')}
});

/* ---------- boot ---------- */
load();applyTheme();
if(cur()){ev('Auth','Session resumed','Page opened again');ntSync();save();renderApp()}else renderLogin();themeLabels();new MutationObserver(themeLabels).observe($('#root'),{childList:true,subtree:true});try{matchMedia('(prefers-color-scheme:dark)').addEventListener('change',themeLabels)}catch(e){}
</script>

</body></html>
